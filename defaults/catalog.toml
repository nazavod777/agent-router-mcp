# ---------------------------------------------------------------------------
# Models — Anthropic (Claude Code)
# ---------------------------------------------------------------------------

[models."claude-opus-5-5"]
harness = "claude"
cli_model = "claude-opus-5-5"
display_name = "Claude Opus 5.5"
tier = "deep"
efforts = ["low", "medium", "high", "xhigh", "max"]
default_effort = "high"
cost_tier = "high"
cost_note = "~$4 / $20 per 1M tokens (input / output). Pays off on architecture, review, and root-cause work. At max it burns ~173K output tokens per task — never use max."
speed_note = "Medium on medium/high, slow on xhigh/max: thinks for a long time before its first action."
context_window = 200000
strengths = [
  "#1 on Senior SWE-bench for solution neatness: minimal, readable, in the project's style",
  "Best reviewer in the catalog: finds non-obvious consumers of a change and edge cases",
  "#2 DesignArena HII; Terminal-Bench 4 — 64.8% (Snorkel)",
]
weaknesses = [
  "Can inflate task scope without clear boundaries",
  "max effort is a trap: several times the cost of high with no noticeable gain",
  "200K context — smaller than the 1M-context models",
]
best_for = [
  "Architecture and change plans with strict invariants and contracts",
  "Independent code review and final check of a risky change",
  "Root cause debugging of tangled bugs, security audit",
]
avoid_for = [
  "Boilerplate and mass mechanical edits",
  "Scanning huge volumes of text — cheaper 1M-context models exist",
]
checked_at = "2026-11-25"
enabled = true

[models."claude-sonnet-5-5"]
