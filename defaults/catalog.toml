# agent-router-mcp — default catalog.
# User overrides are merged on top of this file. Model cards are opinionated
# routing hints, not benchmarks: re-check them when `checked_at` gets stale.
#
# Curation rules (2026-11-25):
# - Prefer independent agentic/terminal runs (Vals / Snorkel Terminal-Bench, SWE-Atlas,
#   FrontierSWE) over saturated vendor leaderboards; a model is ranked in the harness it runs in.
# - No preset uses `max` effort: on the measured models `max` costs several times more
#   tokens and is often no better than `high`/`xhigh`.
# - Review and security roles go to a different vendor or lab than the author role.
# - Every preset maps all 23 built-in roles; every preset role points to an enabled model.

schema_version = 1

[defaults]
stale_after_days = 90
max_concurrency = 8
max_queue_size = 32
default_timeout_sec = 900
max_timeout_sec = 3600
max_mcp_output_bytes = 24000
max_log_bytes_per_job = 10485760
orch_max_depth = 1
inherit_mcp = false
require_plan_id = false
allow_unsandboxed_write = true

[aliases]
# Backwards-compatible and convenience aliases (alias -> canonical id in [models])
"claude-opus" = "claude-opus-5-5"
"claude-sonnet" = "claude-sonnet-5-5"
"claude-fable" = "claude-fable-5-2"
"claude-haiku" = "claude-haiku-5-5"
"gpt-sol" = "gpt-6.2-sol"
"gpt-astra" = "gpt-6.2-astra"
"gpt-terra" = "gpt-6.1-terra"
"gpt-luna" = "gpt-6-luna"
"deepseek-r1" = "deepseek-v4-pro"
"deepseek-v4.1-flash" = "deepseek-flash"
"glm-5.3" = "pi-glm-5.3"
"glm-5.3-flash" = "pi-glm-5.3-flash"
"kimi-k3.1-pro" = "pi-kimi-k3.1-pro"
"kimi-k2.7-code" = "pi-kimi-k2.7-code"
"qwen4-max" = "pi-qwen4-max"
"minimax-m3.1-flash" = "pi-minimax-m3.1-flash"
"mimo-v2.6-pro" = "pi-mimo-v2.6-pro"
"grok-4.7" = "pi-grok-4.7"
"gemini-4-argon" = "pi-gemini-4-argon"
"agy-neon" = "agy-gemini-4-neon"
"agy-argon" = "agy-gemini-4-argon"
"agy-flash" = "agy-gemini-3.8-flash"
"grok-build" = "grok-build-4.7"
