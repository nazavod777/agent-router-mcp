name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **redact** tokens, API keys, personal paths, and private prompts from everything you paste. For security problems, use a private advisory instead: https://github.com/nazavod777/agent-router-mcp/security/advisories/new
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands or MCP tool calls, as small as you can make them.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agent-router-mcp version or commit
      placeholder: "0.1.0 or a commit hash"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: "output of `node -v`"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: harness
    attributes:
      label: Harness and CLI versions
      description: Which CLI harnesses are involved (claude, codex, ...) and their versions.
  - type: textarea
    id: doctor
    attributes:
      label: "`agrmcp doctor --json` output"
      description: Redacted output helps a lot. Check that `config_warnings` and `quarantined` are included.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Error output and logs
      description: The exact `raw_error` or stack trace, redacted.
      render: text
