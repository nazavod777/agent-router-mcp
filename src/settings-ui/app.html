const $ = (id) => document.getElementById(id);

function h(tag, props, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === null || value === undefined || value === false) continue;
    if (key === "class") el.className = value;
    else if (key === "text") el.textContent = String(value);
    else if (key.startsWith("on") && typeof value === "function") el.addEventListener(key.slice(2), value);
    else if (key === "checked" || key === "disabled" || key === "hidden") el[key] = Boolean(value);
    else el.setAttribute(key, value === true ? "" : String(value));
  }
  for (const child of children.flat(Infinity)) {
    if (child === null || child === undefined || child === false) continue;
    el.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return el;
}

/** Inline SVG that references a symbol from the sprite (no Unicode glyphs as icons). */
function icon(name, cls = "") {
  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", cls ? `icon ${cls}` : "icon");
  svg.setAttribute("aria-hidden", "true");
  svg.setAttribute("focusable", "false");
  svg.setAttribute("width", "16");
  svg.setAttribute("height", "16");
  const use = document.createElementNS(SVG_NS, "use");
  use.setAttribute("href", `#i-${name}`);
  svg.append(use);
  return svg;
}

/** Button with an optional leading sprite icon and a text label. */
function button(label, { cls = "btn", iconName, ...props } = {}) {
  return h("button", { type: "button", class: cls, ...props }, iconName ? icon(iconName) : null, h("span", { text: label }));
}

function iconButton(iconName, label, { cls = "icon-btn", ...props } = {}) {
  return h("button", { type: "button", class: cls, "aria-label": label, title: label, ...props }, icon(iconName));
}

function statusPill(kind, text, extra = {}) {
  return h("span", { class: `status-pill ${kind}`, ...extra, text });
}

function banner(kind, text, ...extra) {
  return h("div", { class: `banner${kind ? " " + kind : ""}`, role: kind === "danger" ? "alert" : null },
    icon("alert"), h("div", { class: "grow" }, h("div", { text }), ...extra));
}

function isTypingTarget(el) {
  if (!el || el === document.body) return false;
  const tag = el.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || el.isContentEditable || el.getAttribute("role") === "combobox";
}

function isMobile() {
  return window.matchMedia ? window.matchMedia(MOBILE_QUERY).matches : false;
}

function captureFocus() {
  const active = document.activeElement;
  if (!active || !active.dataset || !active.dataset.fk) return null;
  let start = null;
  let end = null;
  try { start = active.selectionStart; end = active.selectionEnd; } catch { /* not a text input */ }
  return { key: active.dataset.fk, start, end };
}

function focusByKey(key) {
  if (!key) return false;
  const el = document.querySelector(`[data-fk="${CSS.escape(key)}"]`);
  if (!el || el.closest("[inert]")) return false;
  el.focus({ preventScroll: true });
  return document.activeElement === el;
}

function restoreFocus(saved) {
  if (!saved || !focusByKey(saved.key)) return;
  const el = document.activeElement;
  if (typeof saved.start === "number" && typeof el.setSelectionRange === "function") {
    try { el.setSelectionRange(saved.start, saved.end); } catch { /* not a text input */ }
  }
}

const clone = (value) => (value === undefined ? undefined : JSON.parse(JSON.stringify(value)));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

/** Own-property lookup in a snapshot map: an ID such as "toString" must never resolve to a member of Object.prototype. */
function entry(map, id) {
  return map && Object.hasOwn(map, id) ? map[id] : undefined;
}

function strip(entity) {
  const out = {};
  for (const [key, value] of Object.entries(entity || {})) if (!META_KEYS.has(key)) out[key] = clone(value);
  return out;
}

function diff(original, draft) {
  const patch = {};
  for (const [key, value] of Object.entries(draft)) if (!same(value, original[key])) patch[key] = value;
  return patch;
}

/**
 * Changed fields of a draft, plus `_unset` for optional fields that the stored entity has and the draft no longer sets.
 * Clearing goes through `_unset` for built-in and custom entities alike; an empty string is never sent for an optional field.
 */
function buildPatch(original, draft, optionalKeys) {
  const patch = {};
  for (const [key, value] of Object.entries(draft)) {
    if (value !== undefined && !same(value, original[key])) patch[key] = value;
  }
  const unset = optionalKeys.filter((key) => original[key] !== undefined && draft[key] === undefined);
  if (unset.length) patch._unset = unset;
  return patch;
}

/** Trims the named string fields and drops the ones left empty, so an optional field is either set or absent. */
function dropBlankOptionals(draft, keys) {
  const out = { ...draft };
  for (const key of keys) {
    const value = typeof out[key] === "string" ? out[key].trim() : out[key];
    if (value === undefined || value === null || value === "") delete out[key]; else out[key] = value;
  }
  return out;
}

/** Whether `id` may be used for a NEW entity; mirrors entityIdProblem() in src/config/ids.ts. */
function isValidNewId(id) {
  return ID_PATTERN.test(id) && !RESERVED_IDS.has(id) && !id.endsWith("/") && !id.includes("//") && !id.includes("..");
}

function driverMetaOf(driver) {
  return Object.hasOwn(state.driverMeta, driver) ? state.driverMeta[driver] : {};
}

/** Effort levels a new model on this harness starts with: the driver's own suggestion, or low/medium/high for an unknown driver. */
function defaultEffortsFor(harnessId) {
  const harness = state.snap && Object.hasOwn(state.snap.harnesses, harnessId) ? state.snap.harnesses[harnessId] : null;
  const efforts = harness ? driverMetaOf(harness.driver).defaultEfforts : null;
  return Array.isArray(efforts) && efforts.length ? [...efforts] : [...FALLBACK_EFFORTS];
}

function preferredDefaultEffort(efforts) {
  return efforts.includes("medium") ? "medium" : (efforts[0] || "");
}

/** True while a model's effort list is still exactly what its harness would seed, so a harness switch may replace it. */
function effortsAreSeeded(draft, harnessId) {
  const seeded = defaultEffortsFor(harnessId);
  return same(draft.efforts, seeded) && draft.default_effort === preferredDefaultEffort(seeded);
}

/** Switching a new model's harness reseeds the effort levels, unless the user already changed them. */
function applyHarnessChange(draft, harnessId, { reseedEfforts }) {
  const previousSeeded = effortsAreSeeded(draft, draft.harness);
  draft.harness = harnessId;
  if (reseedEfforts && previousSeeded) {
    draft.efforts = defaultEffortsFor(harnessId);
    draft.default_effort = preferredDefaultEffort(draft.efforts);
  }
}

/** Effort suggestions for the chip editor: only the driver's own levels where it has no effort control, otherwise the usual ones too. */
function effortSuggestionsFor(harnessId) {
  const harness = state.snap && Object.hasOwn(state.snap.harnesses, harnessId) ? state.snap.harnesses[harnessId] : null;
  const meta = harness ? driverMetaOf(harness.driver) : {};
  const own = defaultEffortsFor(harnessId);
  return meta.effortSupport === "none" || meta.effortSupport === "model-variant" ? own : [...own, ...EFFORT_SUGGESTIONS.filter((effort) => !own.includes(effort))];
}

/** Cards found by discovery and not yet reviewed may omit the context window and the checked date (mirrors ModelSchema). */
function modelMayOmitCardFacts(model) {
  return model.source === "discovered" && model.metadata_quality !== "reviewed";
}

function modelReferencedByEnabledPreset(id) {
  return Object.values(state.snap.presets).some((preset) => preset.enabled &&
    Object.values(preset.roles || {}).some((role) => role && role.model === id));
}

function today() {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
}

/** Context-specific translation: looks up "context|English" first, then the plain key. */
function tc(context, english) {
  const key = `${context}|${english}`;
  return language === "ru" && Object.hasOwn(russian, key) ? russian[key] : t(english);
}

function capitalize(text) {
  return text ? text.charAt(0).toLocaleUpperCase(language) + text.slice(1) : text;
}

function effortLabel(effort) {
  return EFFORT_SUGGESTIONS.includes(effort) ? t(effort) : effort;
}

function formatContext(tokens) {
  if (typeof tokens !== "number" || !Number.isFinite(tokens)) return "—";
  if (tokens >= 1_000_000) return `${+(tokens / 1_000_000).toFixed(1)}M`;
  if (tokens >= 1_000) return `${Math.round(tokens / 1_000)}K`;
  return String(tokens);
}

function formatUnit(value, unit, key) {
  if (typeof value !== "number" || !Number.isFinite(value)) return "";
  if (value === 0 && key && ZERO_HINTS[key]) return t(ZERO_HINTS[key]);
  if (unit === "bytes") {
    if (value >= 1024 * 1024) return t("≈ {0} MiB", +(value / 1024 / 1024).toFixed(1));
    if (value >= 1024) return t("≈ {0} KiB", +(value / 1024).toFixed(1));
    return t("{0} B", value);
  }
  if (unit === "mib") return value >= 1024 ? t("≈ {0} GiB", +(value / 1024).toFixed(1)) : t("{0} MiB", value);
  if (unit === "sec") return value >= 60 ? t("= {0} min", +(value / 60).toFixed(1)) : t("{0} s", value);
  if (unit === "days") return t("{0} d", value);
  return "";
}

function formatValue(value) {
  if (value === undefined || value === null || value === "") return t("— (unset)");
  if (Array.isArray(value)) {
    if (value.length === 0) return t("[] (empty)");
    return value.some((item) => String(item).length > 24) ? value.map((item) => `- ${item}`).join("\n") : value.join(", ");
  }
  if (typeof value === "boolean") return value ? t("yes") : t("no");
  return String(value);
}

// ---------------------------------------------------------------------------
// API
// ---------------------------------------------------------------------------
class ApiError extends Error {
  constructor(status, message, data) {
    super(message);
    this.status = status;
    this.data = data;
  }
}

async function api(method, path, body, signal) {
  const init = { method, credentials: "same-origin", headers: { "X-Orch-Token": state.csrf }, cache: "no-store" };
  if (signal) init.signal = signal;
  if (method !== "GET") {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body || {});
  }
  let response;
  try {
    response = await fetch(path, init);
  } catch (error) {
    // A request the page cancelled itself (closed discovery drawer) says nothing about the server.
    if (error && error.name === "AbortError") throw new ApiError(0, "The request was cancelled.");
    setOffline(true);
    throw new ApiError(0, "The settings server is unavailable. It may have timed out. Restart agrmcp settings.");
  }
  let data = null;
  try { data = await response.json(); } catch { data = null; }
  if (!response.ok) {
    const message = (data && typeof data.error === "string") ? data.error : `HTTP ${response.status}`;
    if (response.status === 401) setOffline(true);
    throw new ApiError(response.status, message, data);
  }
  // Any authorized answer proves the server is reachable again after a network failure.
  if (state.offline) recoverConnection();
  return data;
}

/** Clears the offline state and restarts the heartbeat at its normal pace. */
function recoverConnection() {
  setOffline(false);
  scheduleHeartbeat();
  toast("ok", () => t("The connection to the settings server is back."));
}

let heartbeatTimer = 0;
/**
 * Sends one heartbeat after the delay, then schedules the next. Never one-shot: it keeps probing every RECONNECT_MS while the
 * server is unreachable, and recoverConnection() restarts it at HEARTBEAT_MS once any request succeeds.
 */
function scheduleHeartbeat() {
  clearTimeout(heartbeatTimer);
  heartbeatTimer = setTimeout(async () => {
    try {
      await api("POST", "/api/heartbeat", {});
    } catch { /* api() records an unreachable server in state.offline */ }
    scheduleHeartbeat();
  }, state.offline ? RECONNECT_MS : HEARTBEAT_MS);
}

/**
 * Sends one config mutation. While it runs `state.busy` freezes the editors (drawer body, limits form) and shows "Saving…", so no
 * edit can slip in between the submitted snapshot and the response. `closeDrawerIfGone` closes the open drawer when the entity it
 * edits no longer exists after the mutation (a deliberate delete); without it a vanished entity becomes a "Recreate" draft.
 */
async function mutate(method, path, body, successMessage, { closeDrawerIfGone = false } = {}) {
  if (state.busy || !state.snap) return false;
  const focus = captureFocus();
  let drawerReturn = null;
  state.busy = true;
  document.body.setAttribute("aria-busy", "true");
  syncSaveUi();
  try {
    const data = await api(method, path, { ...body, revision: state.snap.revision });
    state.snap = data.snapshot;
    rebaseLimitsDraft();
    if (closeDrawerIfGone && drawerEntityIsGone()) drawerReturn = detachDrawer();
    if (successMessage) toast("ok", successMessage);
    return true;
  } catch (error) {
    if (error.status === 409 && error.data && error.data.snapshot) {
      state.snap = error.data.snapshot;
      const conflicts = syncDraftsAfterConflict();
      toast(
        "warn",
        () => t("The configuration changed elsewhere. Untouched fields have been updated. Review your changes and save again."),
        () => conflicts.length ? [t("Edited in both places: {0}", conflicts.join(", "))] : [],
      );
    } else {
      const issues = error.data && Array.isArray(error.data.issues)
        ? error.data.issues.map((issue) => `${issue.path || t("(root)")}: ${issue.message}`)
        : [];
      toast("error", () => t(error.message), () => issues);
    }
    return false;
  } finally {
    state.busy = false;
    document.body.removeAttribute("aria-busy");
    normalizeFilters();
    if (state.snap) syncUrl();
    render();
    if (drawerReturn) restoreDrawerReturn(drawerReturn);
    else if (document.activeElement === document.body) restoreFocus(focus);
  }
}

const TOKEN_STORAGE_KEY = "orch_token";
const TOKEN_FRAGMENT = /^#t=([0-9a-f]{64})$/;

/**
 * The per-session token is never part of the served HTML. The one-time bootstrap redirect delivers it in the URL fragment
 * (`/#t=<token>`), which browsers never send to a server or in a Referer. It is moved into sessionStorage (isolated per
 * origin and port, so another local server cannot read it), and the fragment is removed from the address bar at once.
 */
function acquireToken() {
  const match = TOKEN_FRAGMENT.exec(location.hash);
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
  try {
    if (match) {
      sessionStorage.setItem(TOKEN_STORAGE_KEY, match[1]);
      return match[1];
    }
    return sessionStorage.getItem(TOKEN_STORAGE_KEY) || "";
  } catch {
    return match ? match[1] : ""; // Storage disabled: the token lives only until this page is reloaded.
  }
}

async function loadState() {
  state.csrf = acquireToken();
  if (!state.csrf) throw new Error("This page has no session token. Open the settings URL printed in your terminal; if it was already used, restart agrmcp settings.");
  const data = await api("GET", "/api/state");
  state.snap = data.snapshot;
  state.defs = data.defaults_catalog;
  state.drivers = Array.isArray(data.supported_drivers) ? data.supported_drivers : [];
  state.driverMeta = data.driver_metadata || {};
  state.inferredVendors = data.inferred_vendor_family || {};
  state.paths = { catalog: data.catalogPath, user: data.userConfigPath, stateDir: data.stateDir };
}

/**
 * Probes harness health. `refresh` bypasses the server cache and always starts a new probe; `quiet` suppresses toasts
 * (boot and save-triggered probes). Only the response of the latest probeSeq is applied.
 */
async function loadHealth(refresh, { quiet = false } = {}) {
  if (state.healthLoading && !refresh) return;
  const seq = ++state.probeSeq;
  state.healthLoading = true;
  // Health only changes the rail and the page behind the drawer; rebuilding the drawer would drop text typed into it.
  render({ skipDrawer: true });
  try {
    const data = await api("GET", refresh ? "/api/health?refresh=1" : "/api/health");
    if (seq !== state.probeSeq) return;
    state.health = data.harnesses;
    if (refresh && !quiet) toast("ok", () => t("Harness status refreshed"));
  } catch (error) {
    if (seq === state.probeSeq && !quiet) toast("error", () => t(error.message));
  } finally {
    if (seq === state.probeSeq) {
      state.healthLoading = false;
      render({ skipDrawer: true });
    }
  }
}

function setOffline(value) {
  if (state.offline === value) return;
  state.offline = value;
  // Only the banner area changes; an open drawer keeps its inputs.
  render({ skipDrawer: true });
}

// ---------------------------------------------------------------------------
// Toasts & dialogs
// ---------------------------------------------------------------------------
const TOAST_ICON = { ok: "check", error: "alert", warn: "alert", info: "alert" };
const toastRenderers = new WeakMap();
function toast(kind, getMessage, getDetails = () => []) {
  const node = h("div", { class: `toast ${kind}`, role: kind === "error" ? "alert" : "status" });
  const dismiss = () => {
    node.classList.add("leaving");
    setTimeout(() => node.remove(), 220);
  };
  const redraw = () => {
    const details = getDetails();
    const list = details.length ? h("ul", { class: "details" }, details.slice(0, 6).map((line) => h("li", { text: line }))) : null;
    node.replaceChildren(
      icon(TOAST_ICON[kind] || "alert"),
      h("div", { class: "grow" }, h("strong", { text: getMessage() }), list),
      iconButton("close", t("Dismiss notification"), { onclick: dismiss }));
  };
  toastRenderers.set(node, redraw);
  redraw();
  $("toasts").append(node);
  setTimeout(dismiss, kind === "error" ? TOAST_MS * 2 : TOAST_MS);
}

function confirmDialog({ title, text, note, confirmLabel, danger }) {
  const dialog = $("confirm");
  const returnFocus = document.activeElement;
  const returnKey = returnFocus && returnFocus.dataset ? returnFocus.dataset.fk : null;
  return new Promise((resolve) => {
    let settled = false;
    const finish = (value) => {
      if (settled) return;
      settled = true;
      if (dialog.open) dialog.close();
      setShellInert(Boolean(state.drawer));
      if (returnFocus && returnFocus.isConnected && !returnFocus.closest("[inert]")) returnFocus.focus({ preventScroll: true });
      else if (!focusByKey(returnKey) && state.drawer) focusDrawerStart();
      resolve(value);
    };
    const confirmButton = h("button", { type: "button", class: danger ? "btn danger-solid" : "btn primary", onclick: () => finish(true) }, confirmLabel);
    const cancelButton = h("button", { type: "button", class: "btn", onclick: () => finish(false) }, t("Cancel"));
    dialog.setAttribute("aria-labelledby", "confirm-title");
    dialog.setAttribute("aria-describedby", note ? "confirm-text confirm-note" : "confirm-text");
    dialog.replaceChildren(
      h("div", { class: "dialog-body" }, h("h2", { id: "confirm-title", text: title }), h("p", { id: "confirm-text", text }),
        note ? h("p", { class: "field-hint", id: "confirm-note", text: note }) : null),
      h("div", { class: "dialog-actions" }, cancelButton, confirmButton),
    );
    dialog.oncancel = (event) => { event.preventDefault(); finish(false); };
    dialog.onclose = () => finish(false);
    setShellInert(true);
    dialog.showModal();
    // A destructive confirmation starts on the safe choice.
    (danger ? cancelButton : confirmButton).focus();
  });
}

// ---------------------------------------------------------------------------
// Form controls
// ---------------------------------------------------------------------------
function textInput(value, onInput, { fk, type = "text", mono = false, placeholder, multiline = false, min, max } = {}) {
  const props = {
    class: `input${mono ? " mono" : ""}${type === "number" ? " num" : ""}`, id: fk, "data-fk": fk, placeholder, spellcheck: mono ? "false" : null,
    oninput: (event) => onInput(event.target.value),
  };
  if (multiline) {
    const area = h("textarea", { ...props, rows: 2 });
    area.value = value ?? "";
    return area;
  }
  const input = h("input", { ...props, type, min, max, inputmode: type === "number" ? "numeric" : null, autocomplete: "off" });
  input.value = value ?? "";
  return input;
}

function swallowNextClick() {
  const stop = (event) => { event.stopPropagation(); event.preventDefault(); };
  document.addEventListener("click", stop, { capture: true, once: true });
  setTimeout(() => document.removeEventListener("click", stop, true), SELECT_SCROLL_GUARD_MS * 4);
}

/** The one open combobox, so a new one (or a re-render) can close it first. */
let activeSelect = null;
let selectSeq = 0;
function closeActiveSelect() {
  if (activeSelect) activeSelect.close();
}

/**
 * Select-only combobox (ARIA APG): focus stays on the trigger, the listbox is referenced through aria-activedescendant. The menu is a
 * top-layer popover anchored to the trigger (no clipping inside the drawer or the matrix); browsers without anchor positioning get an
 * absolutely positioned menu that flips upward through a CSS class and closes when an ancestor scrolls or the window resizes.
 */
function selectBox(options, value, onChange, { fk, label, disabled = false } = {}) {
  const pairs = options.map((option) => (Array.isArray(option) ? option : [option, option]));
  const current = value === undefined || value === null ? "" : value;
  const items = current !== "" && !pairs.some(([optionValue]) => optionValue === current)
    ? [[current, t("{0} (unavailable)", current)], ...pairs]
    : pairs;
  const noOptions = pairs.length === 0;
  const uid = fk || `select-${++selectSeq}`;
  const selectedIndex = items.findIndex(([optionValue]) => optionValue === current);
  const triggerText = selectedIndex >= 0 ? items[selectedIndex][1] : noOptions ? t("No options available") : t("Select…");
  let isOpen = false;
  let activeIndex = -1;
  let typed = "";
  let typedTimer = 0;
  let scrollGuardUntil = 0;
  let labelPress = false;

  const optionNodes = items.map(([, optionLabel], index) => h("li", {
    class: "select-option", role: "option", id: `${uid}-opt-${index}`, "aria-selected": String(index === selectedIndex), title: optionLabel,
    onmouseenter: () => setActive(index, false), onclick: () => commit(index),
  }, icon("check"), h("span", { class: "select-option-label", text: optionLabel })));
  const menu = h("ul", {
    class: "select-menu", id: `${uid}-listbox`, role: "listbox", "aria-label": label || null,
    popover: SUPPORTS_POPOVER_ANCHOR ? "manual" : null, hidden: !SUPPORTS_POPOVER_ANCHOR,
    // Keep keyboard focus on the trigger while the pointer works the list.
    onmousedown: (event) => event.preventDefault(),
  }, optionNodes);
  const trigger = h("button", {
    type: "button", class: "select-trigger", id: fk, "data-fk": fk, role: "combobox", "aria-haspopup": "listbox",
    "aria-expanded": "false", "aria-controls": menu.id, "aria-label": label || null, title: triggerText,
    disabled: disabled || noOptions,
    onclick: () => (isOpen ? close() : open()),
    onkeydown: (event) => onTriggerKey(event),
    // Firefox clicks a button on Space keyup even after keydown was handled.
    onkeyup: (event) => { if (event.key === " ") event.preventDefault(); },
    // Pressing the field's own <label> blurs the trigger first; the label's click then toggles the list instead of reopening it.
    onblur: () => { if (labelPress) labelPress = false; else close(); },
  }, h("span", { class: `select-label${selectedIndex < 0 ? " is-placeholder" : ""}`, text: triggerText }), icon("chevron-down", "select-chevron"));
  const wrap = h("div", { class: "select-wrap" }, trigger, menu);

  function setActive(index, scroll = true) {
    const previous = optionNodes[activeIndex];
    if (previous) previous.classList.remove("is-active");
    activeIndex = index;
    const node = optionNodes[index];
    if (!node) { trigger.removeAttribute("aria-activedescendant"); return; }
    node.classList.add("is-active");
    trigger.setAttribute("aria-activedescendant", node.id);
    if (scroll) {
      scrollGuardUntil = performance.now() + SELECT_SCROLL_GUARD_MS;
      node.scrollIntoView({ block: "nearest" });
    }
  }

  function placeFallbackMenu() {
    const rect = trigger.getBoundingClientRect();
    const room = (side) => (side === "below" ? window.innerHeight - rect.bottom : rect.top);
    menu.classList.toggle("open-up", menu.offsetHeight + 8 > room("below") && room("above") > room("below"));
  }

  function onOutsidePointer(event) {
    const target = event.target;
    if (wrap.contains(target)) return;
    const labelEl = target && target.closest ? target.closest("label[for]") : null;
    if (labelEl && fk && labelEl.htmlFor === fk) { labelPress = true; return; }
    close();
    // Dismissing the list by clicking the dimmed backdrop must not also close the drawer behind it.
    if (target && target.id === "scrim") swallowNextClick();
  }
  function onScrollAway(event) {
    if (menu.contains(event.target) || performance.now() < scrollGuardUntil) return;
    close();
  }

  function open() {
    if (isOpen || trigger.disabled || !wrap.isConnected) return;
    closeActiveSelect();
    isOpen = true;
    activeSelect = { owner: wrap, close };
    trigger.setAttribute("aria-expanded", "true");
    if (SUPPORTS_POPOVER_ANCHOR) {
      trigger.classList.add("is-anchor-open");
      menu.showPopover();
    } else {
      menu.hidden = false;
      placeFallbackMenu();
    }
    setActive(selectedIndex >= 0 ? selectedIndex : 0);
    document.addEventListener("pointerdown", onOutsidePointer, true);
    window.addEventListener("scroll", onScrollAway, true);
    window.addEventListener("resize", close);
  }

  function close() {
    if (!isOpen) return;
    isOpen = false;
    labelPress = false;
    if (activeSelect && activeSelect.owner === wrap) activeSelect = null;
    document.removeEventListener("pointerdown", onOutsidePointer, true);
    window.removeEventListener("scroll", onScrollAway, true);
    window.removeEventListener("resize", close);
    trigger.setAttribute("aria-expanded", "false");
    trigger.removeAttribute("aria-activedescendant");
    trigger.classList.remove("is-anchor-open");
    const active = optionNodes[activeIndex];
    if (active) active.classList.remove("is-active");
    activeIndex = -1;
    typed = "";
    if (SUPPORTS_POPOVER_ANCHOR) {
      try { if (menu.matches(":popover-open")) menu.hidePopover(); } catch { /* menu already left the document */ }
    } else {
      menu.hidden = true;
      menu.classList.remove("open-up");
    }
  }

  /** Commits the option and closes; the committed value is the only thing that ever reaches onChange. */
  function commit(index, { refocus = true } = {}) {
    const entry = items[index];
    close();
    if (refocus) trigger.focus({ preventScroll: true });
    if (entry && entry[0] !== current) onChange(entry[0]);
  }

  function typeahead(character) {
    clearTimeout(typedTimer);
    typed += character.toLowerCase();
    typedTimer = setTimeout(() => { typed = ""; }, SELECT_TYPEAHEAD_MS);
    const repeated = [...typed].every((char) => char === typed[0]);
    const query = repeated ? typed[0] : typed;
    const start = repeated ? activeIndex + 1 : Math.max(activeIndex, 0);
    for (let step = 0; step < items.length; step++) {
      const index = (start + step) % items.length;
      if (items[index][1].toLowerCase().startsWith(query)) { setActive(index); return; }
    }
  }

  function onTriggerKey(event) {
    if (event.ctrlKey || event.metaKey) return;
    const key = event.key;
    const printable = key.length === 1 && !event.altKey;
    const last = items.length - 1;
    if (!isOpen) {
      if (["Enter", " ", "ArrowDown", "ArrowUp", "Home", "End"].includes(key)) {
        event.preventDefault();
        open();
        if (key === "Home") setActive(0);
        else if (key === "End") setActive(last);
      } else if (printable) {
        event.preventDefault();
        open();
        typeahead(key);
      }
      return;
    }
    if (key === "Escape") {
      // Closes only the list: the drawer keeps its own Escape handling.
      event.preventDefault();
      event.stopPropagation();
      close();
    } else if (key === "ArrowDown") {
      event.preventDefault();
      setActive(Math.min(last, activeIndex + 1));
    } else if (key === "ArrowUp") {
      event.preventDefault();
      setActive(Math.max(0, activeIndex - 1));
    } else if (key === "Home" || key === "End") {
      event.preventDefault();
      setActive(key === "Home" ? 0 : last);
    } else if (key === "Enter" || (key === " " && typed === "")) {
      event.preventDefault();
      commit(activeIndex >= 0 ? activeIndex : selectedIndex);
    } else if (key === "Tab") {
      // Commit the highlighted option and let focus move on normally.
      commit(activeIndex >= 0 ? activeIndex : selectedIndex, { refocus: false });
    } else if (printable) {
      event.preventDefault();
      typeahead(key);
    }
  }

  return wrap;
}

function toggle(checked, onChange, { fk, label, text, disabled } = {}) {
  return h("label", { class: "switch", onclick: (event) => event.stopPropagation() },
    h("input", { type: "checkbox", role: "switch", checked, disabled, "data-fk": fk, id: fk, "aria-label": label || text,
      onchange: (event) => onChange(event.target.checked) }),
    h("span", { class: "track", "aria-hidden": "true" }, h("span", { class: "thumb" })),
    text ? h("span", { class: "switch-label", text }) : null);
}

/** Pending (typed but not yet added) text of the open drawer's add-inputs, kept across re-renders and flushed on save. */
function isPendingText(entry) {
  return entry.preserveWhitespace ? entry.text !== "" : entry.text.trim() !== "";
}

function setPending(drawer, fk, text, commit, { preserveWhitespace = false } = {}) {
  if (!drawer.pending) drawer.pending = {};
  const entry = { text, commit, preserveWhitespace };
  if (isPendingText(entry)) drawer.pending[fk] = entry; else delete drawer.pending[fk];
  if (state.drawer === drawer) syncDirtyIndicator();
}

function clearPending(fk) {
  if (state.drawer && state.drawer.pending) delete state.drawer.pending[fk];
}

/** `preserveWhitespace`: the text is a literal token (a CLI argument), so a whitespace-only value is real and must be saved. */
function trackPending(fk, input, commit, options = {}) {
  const drawer = state.drawer;
  if (!drawer) return;
  const kept = drawer.pending && drawer.pending[fk];
  if (kept) { input.value = kept.text; kept.commit = commit; }
  input.addEventListener("input", () => setPending(drawer, fk, input.value, commit, options));
}

function hasPendingText(drawer) {
  return Object.values(drawer.pending || {}).some(isPendingText);
}

/** Adds every typed-but-unsubmitted item before a save; stops (and says why) when one cannot be added. */
function commitPendingInputs() {
  const drawer = state.drawer;
  if (!drawer || !drawer.pending) return true;
  for (const fk of Object.keys(drawer.pending)) {
    const entry = drawer.pending[fk];
    if (!entry) continue;
    if (!isPendingText(entry)) { delete drawer.pending[fk]; continue; }
    if (!entry.commit()) { focusByKey(fk); return false; }
  }
  return true;
}

/** Short tokens (efforts, CLI args) as removable chips. */
function chipEditor(items, onChange, { fk, placeholder, suggestions = [], highlight, label = (value) => value } = {}) {
  const add = (raw) => {
    const value = raw.trim();
    if (!value || items.includes(value)) return false;
    clearPending(fk);
    onChange([...items, value]);
    return true;
  };
  const input = h("input", {
    type: "text", "data-fk": fk, id: fk, placeholder, autocomplete: "off", spellcheck: "false",
    onkeydown: (event) => {
      if (event.key === "Enter" || event.key === ",") {
        event.preventDefault();
        add(event.target.value);
      } else if (event.key === "Backspace" && event.target.value === "" && items.length) {
        onChange(items.slice(0, -1));
      }
    },
  });
  trackPending(fk, input, () => {
    const value = input.value.trim();
    if (!value || add(value)) return true;
    toast("error", () => t("“{0}” is already in the list.", value));
    return false;
  });
  const chips = h("div", { class: "chips" },
    items.map((item, index) => h("span", { class: `chip${item === highlight ? " default-effort" : ""}` },
      h("span", { text: label(item) }),
      h("button", { type: "button", "aria-label": t("Remove {0}", label(item)), onclick: () => onChange(items.filter((_, i) => i !== index)) }, icon("close")))),
    input);
  const missing = suggestions.filter((item) => !items.includes(item));
  return h("div", { class: "list-editor" }, chips, missing.length ? h("div", { class: "suggest" },
    missing.map((item) => h("button", { type: "button", "aria-label": `${t("Add")} ${label(item)}`, onclick: () => onChange([...items, item]) }, label(item)))) : null);
}

/** Sentences (strengths, best_for…) as an editable list. Edits in place do not re-render. */
function listEditor(items, onChange, { fk, placeholder }) {
  const working = [...items];
  const rows = working.map((item, index) => h("div", { class: "list-item" },
    h("span", { class: "bullet", "aria-hidden": "true" }, icon("chevron-right")),
    (() => {
      const area = h("textarea", { class: "input", rows: 1, "data-fk": `${fk}-${index}`, "aria-label": `${placeholder} ${index + 1}`,
        oninput: (event) => { working[index] = event.target.value; onChange([...working], false); } });
      area.value = item;
      return area;
    })(),
    iconButton("close", t("Remove item"), { cls: "icon-btn danger", onclick: () => onChange(working.filter((_, i) => i !== index), true) })));
  const addPending = () => {
    const text = adder.value.trim();
    if (!text) return true;
    clearPending(`${fk}-new`);
    onChange([...working, text], true);
    return true;
  };
  const adder = h("input", { class: "input", type: "text", "data-fk": `${fk}-new`, id: fk, placeholder, autocomplete: "off",
    onkeydown: (event) => {
      if (event.key === "Enter" && event.target.value.trim()) {
        event.preventDefault();
        addPending();
      }
    } });
  trackPending(`${fk}-new`, adder, addPending);
  const addButton = button(t("Add"), { cls: "btn add-btn", iconName: "plus", onclick: addPending });
  return h("div", { class: "list-editor" }, rows, h("div", { class: "input-row" }, adder, addButton));
}

/**
 * CLI arguments, one input row per argv token. Unlike chipEditor it never splits on commas (`--enabled-tools a,b` is one token),
 * keeps duplicates (`-c a=1 -c b=2`), and keeps the order, which the CLI reads. Edits in place do not re-render.
 */
function argvEditor(items, onChange, { fk, placeholder }) {
  const working = [...items];
  const move = (index, delta) => {
    const next = [...working];
    const [moved] = next.splice(index, 1);
    next.splice(index + delta, 0, moved);
    onChange(next, true);
  };
  const rows = working.map((item, index) => {
    const input = h("input", { class: "input mono", type: "text", "data-fk": `${fk}-${index}`, autocomplete: "off", spellcheck: "false",
      "aria-label": `${t("Argument")} ${index + 1}`,
      oninput: (event) => { working[index] = event.target.value; onChange([...working], false); } });
    input.value = item;
    return h("div", { class: "argv-row" }, input,
      iconButton("chevron-down", t("Move up"), { cls: "icon-btn flip", disabled: index === 0, onclick: () => move(index, -1) }),
      iconButton("chevron-down", t("Move down"), { disabled: index === working.length - 1, onclick: () => move(index, 1) }),
      iconButton("close", t("Remove item"), { cls: "icon-btn danger", onclick: () => onChange(working.filter((_, i) => i !== index), true) }));
  });
  // A token is kept exactly as typed: leading and trailing spaces can be part of a literal argument.
  const addPending = () => {
    const text = adder.value;
    if (text === "") return true;
    clearPending(fk);
    onChange([...working, text], true);
    return true;
  };
  const adder = h("input", { class: "input mono", type: "text", "data-fk": fk, id: fk, placeholder, autocomplete: "off", spellcheck: "false",
    onkeydown: (event) => {
      if (event.key === "Enter" && event.target.value !== "") {

        addPending();
      }
    } });
  trackPending(fk, adder, addPending, { preserveWhitespace: true });
  return h("div", { class: "list-editor" }, rows,
    h("div", { class: "input-row" }, adder, button(t("Add"), { cls: "btn add-btn", iconName: "plus", onclick: addPending })));

// ---------------------------------------------------------------------------
// URL state
// ---------------------------------------------------------------------------
function readUrl() {
  const params = new URLSearchParams(location.search);
  const tab = params.get("tab");
  state.tab = TAB_IDS.includes(tab) ? tab : "models";
  // An old "?harness=all" link is kept readable: normalizeFilters() falls back to every harness unless a harness literally named "all" exists.
  state.harnessFilter = params.get("harness") || ALL_HARNESSES;
  const tier = params.get("tier");
  state.tierFilter = TIERS.includes(tier) ? tier : "all";
  const status = params.get("status");
  state.statusFilter = STATUS_FILTER_IDS.includes(status) ? status : "all";
  state.query = (params.get("q") || "").slice(0, MAX_QUERY_LENGTH);
  state.presetSelected = params.get("preset") || "";
}

/** Drops filters that point at entities which no longer exist. */
function normalizeFilters() {
  if (!state.snap) return;
  if (state.harnessFilter !== ALL_HARNESSES && !Object.hasOwn(state.snap.harnesses, state.harnessFilter)) state.harnessFilter = ALL_HARNESSES;
  if (state.presetSelected && !Object.hasOwn(state.snap.presets, state.presetSelected)) state.presetSelected = "";
}

function urlForState(tab = state.tab) {
  const params = new URLSearchParams();
  if (tab !== "models") params.set("tab", tab);
  if (tab === "models") {
    if (state.harnessFilter !== ALL_HARNESSES) params.set("harness", state.harnessFilter);
    if (state.tierFilter !== "all") params.set("tier", state.tierFilter);
    if (state.statusFilter !== "all") params.set("status", state.statusFilter);
    if (state.query.trim()) params.set("q", state.query.trim());
  }
  if (tab === "presets" && state.presetSelected && state.presetSelected !== defaultPresetId()) params.set("preset", state.presetSelected);
  const query = params.toString();
  return query ? `${location.pathname}?${query}` : location.pathname;
}

let urlSyncTimer = 0;
function syncUrl({ debounce = false } = {}) {
  clearTimeout(urlSyncTimer);
  const apply = () => {
    const next = urlForState();
    if (next === location.pathname + location.search) return;
    try { history.replaceState(null, "", next); } catch { /* rate-limited by the browser */ }
  };
  if (debounce) urlSyncTimer = setTimeout(apply, URL_SYNC_DEBOUNCE_MS);
  else apply();
}

function navigate(tab, { focusMain = false } = {}) {
  if (!TAB_IDS.includes(tab)) return;
  const changed = state.tab !== tab;
  state.tab = tab;
  state.railOpen = false;
  syncUrl();
  render();
  if (changed) window.scrollTo({ top: 0 });
  if (focusMain) $("main").focus({ preventScroll: true });
  if (tab === "harnesses" && !state.health && !state.healthLoading) void loadHealth(false);
}

function setModelFilter(key, value, { debounceUrl = false } = {}) {
  state[key] = value;
  syncUrl({ debounce: debounceUrl });
  render();
}

function clearModelFilters() {
  state.query = "";
  state.harnessFilter = ALL_HARNESSES;
  state.tierFilter = "all";
  state.statusFilter = "all";
  syncUrl();
  render();
  focusByKey("model-search");
}

// ---------------------------------------------------------------------------
// Rail: navigation, harness facets, status footer
// ---------------------------------------------------------------------------
function modifiedCount() {
  if (!state.snap) return 0;
  let count = 0;
  for (const section of ["models", "harnesses", "presets"]) {
    for (const entity of Object.values(state.snap[section])) if (entity.provenance !== "default") count++;
  }
  for (const provenance of Object.values(state.snap.defaults_provenance || {})) if (provenance !== "default") count++;
  return count;
}

function shortPath(path) {
  if (!path || path.length <= 28) return path;
  const parts = path.split(/[\\/]/).filter(Boolean);
  return parts.length > 2 ? `…/${parts.slice(-2).join("/")}` : path;
}

function healthOf(id) {
  return state.health ? entry(state.health, id) || null : null;
}

/** ready = installed and signed in (or sign-in state unknown); missing or signed out = not ready. */
function harnessHealthState(id) {
  const health = healthOf(id);
  if (!health) return "unchecked";
  if (!health.installed) return "missing";
  if (health.auth_status === "unauthenticated") return "signed-out";
  return health.auth_status === "ready" ? "ready" : "unverified";
}

function readinessSummary() {
  if (!state.snap || !state.health) return null;
  const enabled = Object.entries(state.snap.harnesses).filter(([, harness]) => harness.enabled).map(([id]) => id);
  const states = enabled.map(harnessHealthState);
  // Only a verified sign-in counts as ready; "unverified" (installed, auth unknown) is shown apart and never turns the summary green.
  const ready = states.filter((value) => value === "ready").length;
  const unverified = states.filter((value) => value === "unverified").length;
  const level = ready + unverified === 0 ? "bad" : ready === enabled.length ? "ok" : "warn";
  return { states, ready, unverified, total: enabled.length, level };
}

function railLink(href, onNavigate, props, ...children) {
  return h("a", {
    href, ...props,
    onclick: (event) => {
      if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      onNavigate();
    },
  }, ...children);
}

function renderNav() {
  const counts = state.snap ? {
    models: Object.keys(state.snap.models).length,
    harnesses: Object.keys(state.snap.harnesses).length,
    presets: Object.keys(state.snap.presets).length,
  } : {};
  $("tabs").setAttribute("aria-label", t("Settings sections"));
  $("tabs").replaceChildren(...TABS.map((tab, index) => railLink(urlForState(tab.id), () => navigate(tab.id, { focusMain: mobileRailOpen() }), {
    class: "rail-link", "data-fk": `nav-${tab.id}`, "aria-current": state.tab === tab.id ? "page" : null,
    "aria-keyshortcuts": `Alt+${index + 1}`,
  }, icon(tab.icon), h("span", { text: t(tab.label) }),
  counts[tab.id] !== undefined ? h("span", { class: "nav-count", text: counts[tab.id] }) : null)));
}

function renderFacets() {
  const section = $("rail-facets");
  const visible = Boolean(state.snap) && state.tab === "models";
  section.hidden = !visible;
  $("rail-facets-title").textContent = t("Filter by harness");
  if (!visible) { $("facet-list").replaceChildren(); return; }
  const models = Object.values(state.snap.models);
  const pick = (value) => { state.railOpen = false; setModelFilter("harnessFilter", value); };
  const facet = (value, name, count, dot) => h("button", {
    // Harness IDs never start with "-", so "facet--all" cannot collide with a harness facet.
    type: "button", class: "facet", "aria-pressed": String(state.harnessFilter === value), "data-fk": value === ALL_HARNESSES ? "facet--all" : `facet-${value}`,
    translate: value === ALL_HARNESSES ? null : "no", onclick: () => pick(value),
  }, dot, h("span", { class: "facet-name", text: name }), h("span", { class: "facet-count", text: count }));
  $("facet-list").replaceChildren(
    facet(ALL_HARNESSES, t("All harnesses"), models.length, null),
    ...Object.entries(state.snap.harnesses).map(([id, harness]) => facet(id, id,
      models.filter((model) => model.harness === id).length,
      h("span", { class: `dot ${harness.enabled ? "ok" : "unknown"}`, title: harness.enabled ? t("Enabled") : t("Disabled") },
        h("span", { class: "sr-only", text: harness.enabled ? t("Enabled") : t("Disabled") })))));
}

function renderReadiness() {
  const box = $("readiness");
  if (!state.snap) { box.replaceChildren(); box.className = "readiness"; return; }
  const summary = readinessSummary();
  const label = h("span", { class: "readiness-label", text: t("Delegation readiness") });
  if (!summary) {
    box.className = "readiness";
    box.replaceChildren(state.healthLoading
      ? h("div", { class: "readiness-head" }, label, h("span", { class: "readiness-note", text: t("Checking readiness…") }))
      : railLink(urlForState("harnesses"), () => navigate("harnesses"), { class: "readiness-link", title: t("Open Harnesses to see details") },
        h("div", { class: "readiness-head" }, label), h("span", { class: "readiness-note", text: t("Readiness has not been checked yet") })));
    return;
  }
  const blocked = summary.states.some((value) => value === "missing" || value === "signed-out");
  const note = summary.level === "ok" ? t("Ready to delegate")
    : summary.level === "warn" ? (blocked || summary.unverified === 0 ? t("Partly ready: some harnesses are missing or signed out") : t("Installed, but sign-in could not be verified"))
      : t("Not ready: no harness is installed and signed in");
  const meterClass = { ready: "ok", unverified: "warn", missing: "bad", "signed-out": "bad", unchecked: "" };
  box.className = `readiness ${summary.level}`;
  box.replaceChildren(railLink(urlForState("harnesses"), () => navigate("harnesses"), {
    class: "readiness-link", "data-fk": "readiness-link", title: t("Open Harnesses to see details"),
    "aria-label": `${t("{0} of {1} harnesses ready", summary.ready, summary.total)}. ${note}`,
  },
  h("div", { class: "readiness-head" }, label, h("span", { class: "readiness-value", text: `${summary.ready}/${summary.total}` })),
  h("div", { class: "readiness-meter", "aria-hidden": "true" }, summary.states.map((value) => h("i", { class: meterClass[value] || null }))),
  h("span", { class: "readiness-note", text: note })));
}

function renderRailFooter() {
  renderReadiness();
  const count = modifiedCount();
  const counter = $("counter");
  counter.className = `counter${count ? " has" : ""}`;
  counter.replaceChildren(...(state.snap ? [h("span", { class: `dot ${count ? "overridden" : "default"}`, "aria-hidden": "true" }),
    count ? `${count} ${countLabel(count, "change")}` : t("All defaults")] : []));
  const pathPill = $("path-pill");
  pathPill.replaceChildren(icon(state.pathCopied ? "check" : "copy"), h("span", { id: "path-text", translate: "no", text: shortPath(state.paths.user) || "…" }));
  pathPill.title = !state.paths.user ? t("Copy the user configuration path") : t("User configuration: {0}\nBuilt-in catalog: {1}\nState directory: {2}\n\nClick to copy the configuration path.", state.paths.user, state.paths.catalog, state.paths.stateDir);
  pathPill.setAttribute("aria-label", state.pathCopied ? t("Path copied") : t("Copy the user configuration path"));
  $("lang-toggle").setAttribute("aria-label", t("Interface language"));
  for (const langButton of $("lang-toggle").querySelectorAll("button")) {
    langButton.setAttribute("aria-pressed", String(langButton.dataset.lang === language));
  }

function mobileRailOpen() {
  return state.railOpen && isMobile();
}

/**
 * Makes the page shell and the skip-to-content link unreachable while a modal layer (drawer, confirm dialog, mobile rail) is open.
 * The link sits outside the shell, so without this a Tab from the page body could still land on it behind the modal.
 */
function setShellInert(inert) {
  $("app-shell").inert = inert;
  setSkipLinkInert(inert);
}

function setSkipLinkInert(inert) {
  const skip = document.querySelector(".skip-link");
  if (!skip) return;
  skip.inert = inert;
  if (inert) { skip.setAttribute("aria-hidden", "true"); skip.setAttribute("tabindex", "-1"); }
  else { skip.removeAttribute("aria-hidden"); skip.removeAttribute("tabindex"); }
}

/** Rail drawer on small screens, the inspector drawer, the scrim, and inert regions. */
function syncOverlays() {
  const railOpen = mobileRailOpen();
  $("rail").classList.toggle("open", railOpen);
  const railToggle = $("rail-toggle");
  railToggle.setAttribute("aria-expanded", String(railOpen));
  railToggle.setAttribute("aria-label", railOpen ? t("Close navigation") : t("Open navigation"));
  railToggle.replaceChildren(icon(railOpen ? "close" : "menu", "icon-lg"));
  $("scrim").classList.toggle("open", Boolean(state.drawer) || railOpen);
  $("main").inert = railOpen;
  if (!$("confirm").open) setShellInert(Boolean(state.drawer));
  // The mobile rail makes <main> inert, so the link would have nothing to skip to.
  if (railOpen) setSkipLinkInert(true);
}

function setRailOpen(open) {
  state.railOpen = open;
  syncOverlays();
  if (open) {
    const current = $("tabs").querySelector("[aria-current='page']") || $("tabs").querySelector("a");
    if (current) current.focus();
  } else {
    $("rail-toggle").focus();
  }
}

function renderChrome() {
  document.documentElement.lang = language;
  document.title = t("Orchestrator Settings");
  $("brand-name").textContent = document.title;
  const skip = document.querySelector(".skip-link");
  if (skip) skip.textContent = t("Skip to content");
  $("rail").setAttribute("aria-label", t("Primary navigation"));
  const current = TABS.find((tab) => tab.id === state.tab);
  $("mobile-title").textContent = current && state.snap ? t(current.label) : document.title;
  renderNav();
  renderFacets();
  renderRailFooter();
  syncOverlays();
}

// ---------------------------------------------------------------------------
// Models view
// ---------------------------------------------------------------------------
function harnessIds() {
  return Object.keys(state.snap.harnesses);
}

function modelsFor(harnessId) {
  return Object.entries(state.snap.models).filter(([, model]) => model.harness === harnessId).map(([id]) => id);
}

function sortedModels() {
  const harnessOrder = harnessIds();
  return Object.entries(state.snap.models).sort(([idA, a], [idB, b]) =>
    (harnessOrder.indexOf(a.harness) - harnessOrder.indexOf(b.harness)) ||
    (TIERS.indexOf(a.tier) - TIERS.indexOf(b.tier)) ||
    a.display_name.localeCompare(b.display_name) || idA.localeCompare(idB));
}

function modelMatches(id, model) {
  if (state.harnessFilter !== ALL_HARNESSES && model.harness !== state.harnessFilter) return false;
  if (state.tierFilter !== "all" && model.tier !== state.tierFilter) return false;
  if (state.statusFilter === "enabled" && !model.enabled) return false;
  if (state.statusFilter === "disabled" && model.enabled) return false;
  if (state.statusFilter === "modified" && model.provenance === "default") return false;
  if (state.statusFilter === "stale" && !model.is_stale) return false;
  const query = state.query.trim().toLowerCase();
  if (!query) return true;
  const haystack = [id, model.display_name, model.cli_model, model.harness, model.tier, model.cost_tier,
    ...(model.strengths || []), ...(model.best_for || [])].join(" ").toLowerCase();
  return query.split(/\s+/).every((word) => haystack.includes(word));
}

function filtersActive() {
  return Boolean(state.query.trim()) || state.harnessFilter !== ALL_HARNESSES || state.tierFilter !== "all" || state.statusFilter !== "all";
}

function searchTrailing() {
  return state.query
    ? iconButton("close", t("Clear search"), { cls: "icon-btn search-clear", onclick: () => { setModelFilter("query", ""); focusByKey("model-search"); } })
    : h("kbd", { class: "kbd", title: t("Press {0} to search", SEARCH_SHORTCUT), text: SEARCH_SHORTCUT });
}

function searchBox() {
  const input = h("input", {
    class: "input", type: "text", id: "model-search", "data-fk": "model-search", enterkeyhint: "search",
    placeholder: t("Search by name, ID, or strengths…"), "aria-label": t("Search models"), autocomplete: "off", spellcheck: "false",
    maxlength: MAX_QUERY_LENGTH, "aria-keyshortcuts": "/ Control+K Meta+K",
    // Typing refreshes only the rows and the count; the focused input itself is never replaced.
    oninput: (event) => {
      state.query = event.target.value;
      syncUrl({ debounce: true });
      refreshModelResults();
    },
  });
  input.value = state.query;
  return h("div", { class: "search-box", role: "search" },
    icon("search"), input, h("span", { class: "search-trailing", id: "search-trailing" }, searchTrailing()));
}

/** Models run on a harness: with none configured, send the user to create one instead of opening a model form with a dead dropdown. */
function addModel() {
  if (!harnessIds().length) {
    toast("info", () => t("Create a harness first: every model runs on one."));
    navigate("harnesses");
    openDrawer("harness", null);
    return;
  }
  openDrawer("model", null);
}

function modelResults(models, visible) {
  if (!harnessIds().length) {
    return emptyState({ iconName: "harnesses", title: t("Add a harness first"),
      text: t("Models run on a harness (a CLI such as Claude Code). Create a harness first, then add models to it."),
      actions: [button(t("Add harness"), { cls: "btn primary", iconName: "plus", "data-fk": "add-harness-first", onclick: () => { navigate("harnesses"); openDrawer("harness", null); } })] });
  }
  if (!models.length) {
    return emptyState({ iconName: "models", title: t("No models yet."),
      actions: [button(t("Add model"), { cls: "btn primary", iconName: "plus", onclick: addModel })] });
  }
  if (!visible.length) {
    return emptyState({ iconName: "search", title: t("No matching models."), text: t("Try a different search, or clear the filters to see every model."),
      actions: [button(t("Clear filters"), { cls: "btn", iconName: "reset", onclick: clearModelFilters })] });
  }
  const headers = [[t("Enabled"), "cell-toggle"], [t("Model"), ""], [t("Harness"), ""], [t("Tier"), ""], [t("Cost"), ""],
    [t("Context"), "cell-num"], [t("Default effort"), ""], [t("Checked"), "cell-num"], [t("Actions"), "cell-actions"]];
  return h("div", { class: "data-table-wrap" }, h("table", { class: "data-table stack" },
    h("thead", {}, h("tr", {}, headers.map(([title, cls], index) =>
      h("th", { scope: "col", class: cls || null }, index === headers.length - 1 ? h("span", { class: "sr-only", text: title }) : title)))),
    h("tbody", {}, visible.map(([id, model]) => modelRow(id, model)))));
}

function visibleModels(models) {
  return models.filter(([id, model]) => modelMatches(id, model));
}

/** Re-renders the result rows, the "Showing x of y" count, and the search affordance without touching the search input. */
function refreshModelResults() {
  const results = $("model-results");
  if (!results || state.tab !== "models" || !state.snap) { render(); return; }
  const models = sortedModels();
  const visible = visibleModels(models);
  results.replaceChildren(modelResults(models, visible));
  const meta = $("filter-meta");
  if (meta) meta.textContent = t("Showing {0} of {1}", visible.length, models.length);
  const trailing = $("search-trailing");
  if (trailing) trailing.replaceChildren(searchTrailing());
}

function renderModels() {
  const models = sortedModels();
  const visible = visibleModels(models);
  const filterBar = h("div", { class: "filter-bar", role: "group", "aria-label": t("Filters") },
    searchBox(),
    segControl([["all", t("All")], ...TIERS.map((tier) => [tier, capitalize(t(tier))])], state.tierFilter,
      (value) => setModelFilter("tierFilter", value), { label: t("Tier filter"), keyPrefix: "tier" }),
    segControl(STATUS_FILTERS.map(([value, label]) => [value, tc("filter", label)]), state.statusFilter,
      (value) => setModelFilter("statusFilter", value), { label: t("Status filter"), keyPrefix: "status" }),
    h("span", { class: "filter-meta", id: "filter-meta", role: "status", "aria-live": "polite", text: t("Showing {0} of {1}", visible.length, models.length) }));
  return h("div", {},
    pageHead(t("Models"), t("Operational catalog of every model the planner can route to. Select a row to inspect and edit it."), [
      button(t("Discover models"), { cls: "btn", iconName: "search", "data-fk": "discover-models", disabled: !harnessIds().length,
        onclick: () => openDiscoveryDrawer(state.harnessFilter) }),
      button(t("Add model"), { cls: "btn primary", iconName: "plus", "data-fk": "add-model", onclick: addModel }),
    ], { saveRule: true }),
    filterBar,
    h("div", { id: "model-results" }, modelResults(models, visible)),
    sectionFooter("models", t("Reset models to defaults")));
}

/** Opens the drawer when a row is clicked outside its interactive controls. */
function rowOpener(open) {
  return (event) => {
    if (event.target.closest("button, a, input, label, select, textarea")) return;
    open();
  };
}

function modelRow(id, model) {

      h("button", { type: "button", class: "cell-button cell-name", "data-fk": `model-open-${id}`, "aria-label": t("Open model {0}", model.display_name), onclick: open }, model.display_name),
      h("span", { class: "cell-id", translate: "no", text: id }),

// ---------------------------------------------------------------------------
// Drawer (shared by models, harnesses, presets)
// ---------------------------------------------------------------------------
const SECTION_OF = { model: "models", harness: "harnesses", preset: "presets" };

function newEntity(kind) {
  if (kind === "model") {
    const harness = harnessIds().includes(state.harnessFilter) ? state.harnessFilter : harnessIds()[0];
    const efforts = defaultEffortsFor(harness);
    return {
      display_name: "", harness, tier: "standard", cost_tier: "medium",
      context_window: 200000, checked_at: today(), enabled: true, efforts, default_effort: preferredDefaultEffort(efforts),
      strengths: [], weaknesses: [], best_for: [], avoid_for: [], cost_note: "", speed_note: "",
    };
  }
  if (kind === "harness") {
    // Optional fields stay absent (inherit_mcp included, so a new harness follows the global default) until the user sets them.
    return { display_name: "", driver: "claude", binary: "", extra_args: [], enabled: true };
  }
  return { description: "", enabled: true, roles: {} };
}

function focusDrawerStart() {
  const drawer = state.drawer;
  const startSelector = isDiscoveryDrawer(drawer) ? "[data-fk='d-scan']"
    : drawer && drawer.isNew && !drawer.deletedElsewhere ? "[data-fk='new-id']" : ".drawer-head .icon-btn";
  const target = $("drawer").querySelector(startSelector);
  if (target) target.focus();
}

function openDrawer(kind, id, { returnKey } = {}) {
  const entity = id ? entry(state.snap[SECTION_OF[kind]], id) : null;
  if (id && !entity) { closeDrawer(true); return; }
  if (!state.drawer) {
    const active = document.activeElement;
    state.drawerReturn = {
      element: active && active !== document.body ? active : null,
      key: (active && active.dataset ? active.dataset.fk : null) || returnKey || null,
    };
  }
  const original = entity ? strip(entity) : newEntity(kind);
  state.drawer = { kind, id, isNew: !id, newId: "", original, draft: clone(original), conflicts: [], deletedElsewhere: false, pending: {} };
  render();
  requestAnimationFrame(focusDrawerStart);
}

/** Anything the user would lose by closing: edited fields, a typed ID, text waiting in an add-input, or an entry deleted elsewhere. */
function drawerDirty() {
  const drawer = state.drawer;
  // The discovery review holds a selection, not edits: closing it loses nothing worth a prompt.
  if (!drawer || isDiscoveryDrawer(drawer)) return false;
  if (drawer.deletedElsewhere) return true;
  // A new drawer is compared with its seeded draft, so an untouched one closes without asking.
  return drawer.newId.trim() !== "" || !same(drawer.original, drawer.draft) || hasPendingText(drawer);
}

function drawerHasUnsavedWork() {
  return drawerDirty();
}

/** True when the open drawer edits a stored entity that the latest snapshot no longer holds. */
function drawerEntityIsGone() {
  const drawer = state.drawer;
  return Boolean(drawer && !isDiscoveryDrawer(drawer) && !drawer.isNew && state.snap && !Object.hasOwn(state.snap[SECTION_OF[drawer.kind]], drawer.id));
}

/** Keeps the user's draft open as a "Recreate" form for an entry that was deleted elsewhere. */
function markDrawerDeletedElsewhere(drawer) {
  drawer.deletedElsewhere = true;
  drawer.isNew = true;
  drawer.newId = drawer.id;
  drawer.id = null;
  drawer.conflicts = [];
}

/** Drops the drawer state without rendering; returns where focus should go back to. */
function detachDrawer() {
  if (isDiscoveryDrawer(state.drawer)) abortDiscoveryScan(state.drawer.discovery);
  const back = state.drawerReturn;
  state.drawer = null;
  state.drawerReturn = null;
  return back;
}

function restoreDrawerReturn(back) {
  if (back && back.element && back.element.isConnected && !back.element.closest("[inert]")) back.element.focus({ preventScroll: true });
  else if (!(back && focusByKey(back.key))) $("main").focus({ preventScroll: true });
}

async function closeDrawer(force) {
  if (!state.drawer) return;
  if (isDiscoveryDrawer(state.drawer) && state.drawer.discovery.saving) return;
  if (!force && drawerHasUnsavedWork()) {
    const ok = await confirmDialog({
      title: state.drawer.deletedElsewhere ? t("Discard your edits to the deleted entry?") : t("Close without saving?"),
      text: t("You will lose your unsaved changes."), confirmLabel: t("Close"), danger: true,
    });
    if (!ok) return;
  }
  const back = detachDrawer();
  render();
  restoreDrawerReturn(back);
}

function rebaseObject(oldBase, localDraft, freshBase) {
  const localChanges = diff(oldBase, localDraft);
  const merged = clone(freshBase);
  const conflicts = [];
  for (const [key, value] of Object.entries(localChanges)) {
    if (!same(oldBase[key], freshBase[key]) && !same(value, freshBase[key])) conflicts.push(key);
    merged[key] = clone(value);
  }
  return { merged, conflicts };
}

/** Per-role three-way merge: keeps concurrent edits to other roles and flags roles edited on both sides. */
function rebaseRoles(oldRoles, localRoles, freshRoles) {
  const merged = clone(freshRoles || {});
  const conflicts = [];
  const names = new Set([...Object.keys(oldRoles || {}), ...Object.keys(localRoles || {})]);
  for (const role of names) {
    const before = Object.hasOwn(oldRoles, role) ? oldRoles[role] : undefined;
    const mine = Object.hasOwn(localRoles, role) ? localRoles[role] : undefined;
    if (same(before, mine)) continue;
    const theirs = Object.hasOwn(merged, role) ? merged[role] : undefined;
    if (!same(before, theirs) && !same(mine, theirs)) conflicts.push(`roles.${role}`);
    if (mine === undefined) delete merged[role]; else merged[role] = clone(mine);
  }
  return { merged, conflicts };
}

function rebaseEntityDraft(drawer, fresh) {
  if (drawer.kind !== "preset") return rebaseObject(drawer.original, drawer.draft, fresh);
  const { roles: oldRoles, ...oldRest } = drawer.original;
  const { roles: localRoles, ...localRest } = drawer.draft;
  const { roles: freshRoles, ...freshRest } = fresh;
  const rest = rebaseObject(oldRest, localRest, freshRest);
  const roles = rebaseRoles(oldRoles || {}, localRoles || {}, freshRoles || {});
  return { merged: { ...rest.merged, roles: roles.merged }, conflicts: [...rest.conflicts, ...roles.conflicts] };
}

/**
 * Rebases the unsaved Limits draft onto the snapshot just adopted and returns the keys edited both here and on disk. Those keys are
 * also recorded in state.limitsConflicts, so the conflict outlives this call (a toast, a discovery refresh, a later unrelated save)
 * until the user explicitly keeps their value or reloads the disk value. Every adopted snapshot goes through here.
 */
function rebaseLimitsDraft() {
  if (!state.limitsDraft || !state.limitsOriginal || !state.snap) return [];
  const fresh = clone(state.snap.defaults);
  const rebased = rebaseObject(state.limitsOriginal, state.limitsDraft, fresh);
  state.limitsOriginal = fresh;
  state.limitsDraft = rebased.merged;
  const recorded = new Set([...(state.limitsConflicts || []), ...rebased.conflicts]);
  state.limitsConflicts = [...recorded].filter((key) => !same(rebased.merged[key], fresh[key]));
  return rebased.conflicts;
}

/** Drops the unsaved Limits draft together with the conflicts recorded against it. */
function clearLimitsDraft() {
  state.limitsDraft = null;
  state.limitsOriginal = null;
  state.limitsConflicts = [];
}

/** Recorded conflicts whose draft value still differs from the disk value. */
function activeLimitsConflicts() {
  if (!state.limitsDraft || !state.snap) return [];
  return (state.limitsConflicts || []).filter((key) => !same(state.limitsDraft[key], state.snap.defaults[key]));
}

/** Tells the user, wherever they are, that a concurrent Limits edit now conflicts with their unsaved one. */
function toastLimitsConflicts(keys) {
  toast("warn", () => t("Limits changed elsewhere while you have unsaved edits: {0}. Review them on the Limits page.", keys.join(", ")));
}

/**
 * After a per-field reset the server holds the fresh entity. Only the reset field takes its fresh value; every other unsaved
 * edit in the open drawer is rebased onto the fresh entity instead of being discarded by reopening the drawer.
 */
function applyFieldReset(drawer, key) {
  if (state.drawer !== drawer) return;
  const entity = Object.hasOwn(state.snap[SECTION_OF[drawer.kind]], drawer.id) ? state.snap[SECTION_OF[drawer.kind]][drawer.id] : undefined;
  if (!entity) { void closeDrawer(true); return; }
  const fresh = strip(entity);
  const rebased = rebaseEntityDraft(drawer, fresh);
  const merged = rebased.merged;
  if (fresh[key] === undefined) delete merged[key]; else merged[key] = clone(fresh[key]);
  drawer.original = fresh;
  drawer.draft = merged;
  drawer.conflicts = rebased.conflicts.filter((conflict) => conflict !== key);
  // Typed-but-unadded text of the reset field must not be re-added by the next Save: a chip or argv editor keeps it under the
  // field key ("<kind initial>-<key>"), a sentence list editor under "<field key>-new".
  if (drawer.pending) {
    const pendingKey = `${drawer.kind[0]}-${key}`;
    delete drawer.pending[pendingKey];
    delete drawer.pending[`${pendingKey}-new`];
  }
  render();
}

function syncDraftsAfterConflict() {
  const conflicts = [];
  const drawer = state.drawer;
  if (drawer && !isDiscoveryDrawer(drawer) && !drawer.isNew) {
    const entity = Object.hasOwn(state.snap[SECTION_OF[drawer.kind]], drawer.id) ? state.snap[SECTION_OF[drawer.kind]][drawer.id] : undefined;
    if (!entity) {
      markDrawerDeletedElsewhere(drawer);
      conflicts.push(drawer.newId);
    } else {
      const rebased = rebaseEntityDraft(drawer, strip(entity));
      drawer.original = strip(entity);
      drawer.draft = rebased.merged;
      drawer.conflicts = rebased.conflicts;
      conflicts.push(...rebased.conflicts);
    }
  }
  conflicts.push(...rebaseLimitsDraft());
  return conflicts;
}

/** The drawer footer always says whether the entry is saved, being saved, edited, or in conflict. */
function drawerStatus() {
  const drawer = state.drawer;
  if (state.busy) return { kind: "saving", icon: "refresh", text: t("Saving…") };
  if (drawer.conflicts && drawer.conflicts.length) return { kind: "conflict", icon: "alert", text: t("Review conflicts") };
  if (drawerDirty()) return { kind: "dirty", icon: "alert", text: t("Unsaved changes") };
  if (drawer.isNew) return { kind: "new", icon: "edit", text: t("Not saved yet") };
  return { kind: "clean", icon: "check", text: t("All changes saved") };
}

function syncDirtyIndicator() {
  if (!state.drawer || isDiscoveryDrawer(state.drawer)) return;
  const status = drawerStatus();
  const indicator = $("drawer-status");
  if (indicator) {
    indicator.className = `save-status is-${status.kind}`;
    indicator.replaceChildren(icon(status.icon), status.text);
  }
  const save = $("drawer-save");
  if (save) save.disabled = state.busy || !drawerDirty();
  const cancel = $("drawer-cancel");
  if (cancel) cancel.disabled = state.busy;
  const body = $("drawer").querySelector(".drawer-body");
  if (body) body.inert = state.busy;
}

/** Reflects an in-flight save in every editor: drawer footer, frozen fields, and the limits save bar. */
function syncSaveUi() {
  syncDirtyIndicator();
  const form = $("limits-form");
  if (form) form.inert = state.busy;
  refreshLimitsSaveBar();
}

function setDraft(key, value, rerender = true) {
  state.drawer.draft[key] = value;
  if (rerender) render(); else syncDirtyIndicator();
}

function renderDrawer() {
  const drawerEl = $("drawer");
  const drawer = state.drawer;
  const previousBody = drawerEl.querySelector(".drawer-body");
  const scrollTop = previousBody ? previousBody.scrollTop : 0;
  if (!drawer) {
    drawerEl.classList.remove("open");
    drawerEl.setAttribute("aria-hidden", "true");
    drawerEl.inert = true;
    drawerEl.replaceChildren();
    return;
  }
  // An entry that vanished from the snapshot must never reach an editor: it becomes a "Recreate" draft instead of crashing.
  if (drawerEntityIsGone()) markDrawerDeletedElsewhere(drawer);
  drawerEl.inert = false;
  drawerEl.classList.add("open");
  drawerEl.removeAttribute("aria-hidden");
  const view = isDiscoveryDrawer(drawer) ? discoveryEditor(drawer)
    : drawer.kind === "model" ? modelEditor(drawer) : drawer.kind === "harness" ? harnessEditor(drawer) : presetEditor(drawer);
  drawerEl.replaceChildren(view.head, view.body, view.foot);
  view.body.scrollTop = scrollTop;
  if (isDiscoveryDrawer(drawer)) syncDiscoveryUi(drawer.discovery);
  else syncDirtyIndicator();
}

function conflictBanners(drawer) {
  const out = [];
  if (drawer.deletedElsewhere) {
    out.push(banner("danger", t("This entry was deleted in another window or in the file. Your edits are kept: select Create to recreate it, or close the panel to discard them.")));
  }
  if (drawer.conflicts && drawer.conflicts.length) {
    out.push(banner("danger", t("Edited in both places: {0}", drawer.conflicts.join(", ")),
      h("div", { class: "field-hint", text: t("The configuration changed elsewhere. Untouched fields have been updated. Review your changes and save again.") })));
  }
  return out;
}

function drawerShell({ title, subtitle, badges, body, entity, kindLabel, onSave, onReset, isCustom }) {
  const drawer = state.drawer;
  const head = h("div", { class: "drawer-head" },
    h("div", { class: "grow" },
      h("h2", { class: "drawer-title", id: "drawer-title", text: title }),
      subtitle ? h("div", { class: "drawer-meta", translate: "no", text: subtitle }) : null,
      badges && badges.filter(Boolean).length ? h("div", { class: "row" }, badges) : null),
    iconButton("close", t("Close panel"), { "aria-keyshortcuts": "Escape", onclick: () => void closeDrawer(false) }));
  const resetButton = !drawer.isNew && entity && entity.provenance !== "default"
    ? button(isCustom ? t("Remove {0}", kindLabel) : t("Reset to default"), { cls: "btn danger", iconName: isCustom ? "trash" : "reset", onclick: onReset })
    : null;
  const saveLabel = drawer.deletedElsewhere ? t("Recreate") : drawer.isNew ? t("Create") : t("Save");
  const foot = h("div", { class: "drawer-foot" },
    resetButton ? h("div", { class: "foot-reset" }, resetButton, h("span", { class: "foot-note", text: t("Reset and delete apply immediately, after you confirm.") })) : null,
    h("span", { class: "spacer" }),
    h("span", { class: "save-status", id: "drawer-status", role: "status", "aria-live": "polite" }),
    h("div", { class: "save-actions" },
      h("button", { type: "button", class: "btn ghost", id: "drawer-cancel", onclick: () => void closeDrawer(false) }, t("Cancel")),
      h("button", { type: "button", class: "btn primary", id: "drawer-save", title: t("Press {0} to save", SAVE_SHORTCUT), "aria-keyshortcuts": "Control+S Meta+S",
        onclick: () => { if (!state.busy && commitPendingInputs()) onSave(); } }, saveLabel),
      h("span", { class: "save-hint", "aria-hidden": "true", text: SAVE_SHORTCUT })));
  return { head, body: h("div", { class: "drawer-body", inert: state.busy }, conflictBanners(drawer), body), foot };
}

function newIdField(label, hint) {
  const drawer = state.drawer;
  return field({ label, key: "id", wide: true, hint,
    control: textInput(drawer.newId, (value) => { drawer.newId = value; syncDirtyIndicator(); refreshModelHints(); }, { fk: "new-id", mono: true, placeholder: "my-entity-id" }) });
}

function validateNewId(section) {
  const id = state.drawer.newId.trim();
  if (!isValidNewId(id)) { toast("error", () => t("Start the ID with a letter or digit. Use only Latin letters, digits, and . _ - : @ / (no “..” or “//”, no trailing “/”).")); return null; }
  if (state.snap[section][id]) { toast("error", () => t("ID “{0}” is already in use.", id)); return null; }
  return id;
}

/** Warns before a custom harness is deleted while models still point at it: they would be set aside as invalid. */
function harnessDeleteNote(id) {
  const users = modelsFor(id);
  if (!users.length) return undefined;
  const listed = users.slice(0, MAX_LISTED_IDS).join(", ") + (users.length > MAX_LISTED_IDS ? "…" : "");
  return t("{0} still use this harness: {1}. They stop working until you move or delete them.", `${users.length} ${countLabel(users.length, "model")}`, listed);
}

async function resetEntity(kind, id, isCustom, name) {
  const section = SECTION_OF[kind];
  const ok = await confirmDialog({
    title: isCustom ? t("Delete “{0}”?", name) : t("Reset “{0}” to default?", name),
    text: isCustom ? t("This will remove the custom entry from your configuration.") : t("This will discard your edits to this entry and restore the built-in values."),
    note: kind === "harness" && isCustom ? harnessDeleteNote(id) : undefined,
    confirmLabel: isCustom ? t("Delete") : t("Reset"), danger: true,
  });
  if (!ok) return;
  const drawer = state.drawer;
  if (await mutate("POST", `/api/${section}/${encodeURIComponent(id)}/reset`, {}, () => isCustom ? t("Deleted") : t("Default restored"), { closeDrawerIfGone: true })) {
    if (state.drawer === drawer && state.snap[section][id]) openDrawer(kind, id);
  }
}

// --- Model editor ----------------------------------------------------------
/** Live advice for the open model draft; an empty string means "nothing to say". Keys match the `data-hint` nodes of the editor. */
function modelHints(drawer) {
  const d = drawer.draft;
  const harness = Object.hasOwn(state.snap.harnesses, d.harness) ? state.snap.harnesses[d.harness] : null;
  const meta = harness ? driverMetaOf(harness.driver) : {};
  const provider = typeof d.cli_provider === "string" ? d.cli_provider.trim() : "";
  const modelName = (typeof d.cli_model === "string" && d.cli_model.trim()) || (drawer.isNew ? drawer.newId.trim() : drawer.id) || "";
  const needsPrefix = Boolean(meta.requiresProviderPrefix) && !provider && !modelName.includes("/");
  // A "/" must separate two non-empty parts: provider on the left, model (which may contain more slashes) on the right.
  const slash = modelName.indexOf("/");
  const malformedRoute = Boolean(meta.requiresProviderPrefix) && !provider && slash !== -1 && (slash === 0 || slash === modelName.length - 1);
  const explicitVendor = typeof d.vendor_family === "string" && d.vendor_family.trim() !== "";
  const edited = (d.cli_model || "") !== (drawer.original.cli_model || "") || d.harness !== drawer.original.harness;
  return {
    "provider-prefix": needsPrefix ? t("OpenCode expects provider/model — set CLI provider or include '/' in CLI model.")
      : malformedRoute ? t("CLI model must look like provider/model, with text on both sides of “/”.") : "",
    "vendor-edit": explicitVendor && !drawer.isNew && edited
      ? t("This card has an explicit vendor family, so it does not follow the CLI model or harness. Clear it to infer the vendor again.") : "",
  };
}

/** Updates the advice nodes in place while the user types, so no re-render steals the focus. */
function refreshModelHints() {
  const drawer = state.drawer;
  if (!drawer || drawer.kind !== "model") return;
  for (const [name, text] of Object.entries(modelHints(drawer))) {
    const node = document.querySelector(`#drawer [data-hint="${name}"]`);
    if (!node) continue;
    node.hidden = !text;
    node.textContent = text;
  }
}

function hintNode(name, text, kind = "") {
  return h("div", { class: `field-hint${kind ? " " + kind : ""}`, "data-hint": name, hidden: !text, text });
}

function clearButton(key) {
  return button(t("Clear"), { cls: "btn", iconName: "close", "data-fk": `clear-${key}`, onclick: () => setDraft(key, undefined) });
}

function modelEditor(drawer) {
  const entity = drawer.isNew ? null : entry(state.snap.models, drawer.id);
  const base = drawer.isNew ? null : (entry(state.defs.models, drawer.id) || null);
  const isCustom = !base || (entity && entity.provenance === "custom");
  const d = drawer.draft;
  const provenanceOf = (key) => (entity && !isCustom ? entity.field_provenance[key] : undefined);
  const defaultChanged = Boolean(entity && entity.default_changed);
  const props = (key, label, control, extra = {}) => field({
    key, label, control, provenance: provenanceOf(key), hasDefault: Boolean(base) && !isCustom, defaultValue: base ? base[key] : undefined,
    defaultChanged: defaultChanged && provenanceOf(key) === "overridden" && base && !same(base[key], entity[key]),
    onReset: () => void mutate("POST", `/api/models/${encodeURIComponent(drawer.id)}/reset-field`, { field: key }, () => t("Field {0} reset", key))
      .then((ok) => ok && applyFieldReset(drawer, key)),
    ...extra,
  });
  const harnessOptions = harnessIds().map((id) => [id, `${id} — ${state.snap.harnesses[id].display_name}`]);
  const harness = entry(state.snap.harnesses, d.harness);
  const meta = harness ? driverMetaOf(harness.driver) : {};
  const hints = modelHints(drawer);
  const setEfforts = (efforts) => {
    d.efforts = efforts;
    if (!efforts.includes(d.default_effort)) d.default_effort = preferredDefaultEffort(efforts);
    render();
  };
  const hasProvider = typeof d.cli_provider === "string" && d.cli_provider.trim() !== "";
  const providerField = meta.usesCliProvider || hasProvider || provenanceOf("cli_provider") === "overridden"
