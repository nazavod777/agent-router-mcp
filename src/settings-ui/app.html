<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="theme-color-meta" content="#f5f4f2">
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="alternate icon" href="/favicon.ico" sizes="any">
<title>Orchestrator Settings</title>
<style nonce="__CSP_NONCE__">
/* Technical Ledger — tokens and rules are documented in DESIGN.md. */
:root {
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.25rem;
  --text-xl: 1.625rem;
  --text-display: 2.25rem;
  --leading-tight: 1.15;
  --leading-snug: 1.35;
  --leading-body: 1.5;
  --tracking-label: 0.06em;

  --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, ui-serif, serif;
  --font-sans: "IBM Plex Sans", "Inter", "Segoe UI", ui-sans-serif, sans-serif;
  --font-mono: "JetBrains Mono", "SF Mono", "Cascadia Mono", Menlo, Consolas, ui-monospace, monospace;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;

  --radius-sm: 4px;
  --radius-lg: 10px;
  --radius-full: 999px;

  --ease: cubic-bezier(.2, .7, .2, 1);
  --dur-fast: .15s;
  --dur-mid: .24s;

  --rail-w: 240px;
  --bar-h: 52px;
  --control-h: 34px;
  --control-h-sm: 28px;
  --touch-target: 44px;
  --drawer-w: min(720px, 100vw);
}
[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f4f2; --surface: #ffffff; --surface-2: #edece8; --surface-3: #e2e0da;
  --border: #d4d0c7; --border-strong: #8f8a80;
  --text: #1d1c19; --text-2: #4a4741; --muted: #6b675f;
  --accent: #166547; --accent-hover: #114f37; --accent-soft: rgba(22, 101, 71, 0.10); --on-accent: #ffffff;
  --ok-ink: #12543b;
  --switch-off: #7a756b;
  --warn: #8c5008; --warn-soft: rgba(140, 80, 8, 0.11);
  --danger: #a82428; --danger-soft: rgba(168, 36, 40, 0.10);
  --selection: rgba(22, 101, 71, 0.18);
  --scrollbar: rgba(29, 28, 25, 0.24);
  --scrim: rgba(29, 28, 25, 0.32);
  --shadow-1: 0 1px 2px rgba(29, 28, 25, 0.06), 0 1px 1px rgba(29, 28, 25, 0.04);
  --shadow-2: 0 2px 4px rgba(29, 28, 25, 0.06), 0 8px 20px rgba(29, 28, 25, 0.08);
  --shadow-3: 0 8px 16px rgba(29, 28, 25, 0.08), 0 24px 56px rgba(29, 28, 25, 0.16);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121210; --surface: #181816; --surface-2: #21201d; --surface-3: #2c2b27;
  --border: #3b3934; --border-strong: #6e6a62;
  --text: #ecebe7; --text-2: #b9b6ae; --muted: #8c8980;
  --accent: #44b582; --accent-hover: #58c996; --accent-soft: rgba(68, 181, 130, 0.14); --on-accent: #121210;
  --ok-ink: #72d6a6;
  --switch-off: #85817a;
  --warn: #e0a042; --warn-soft: rgba(224, 160, 66, 0.14);
  --danger: #ec6d71; --danger-soft: rgba(236, 109, 113, 0.14);
  --selection: rgba(68, 181, 130, 0.28);
  --scrollbar: rgba(236, 235, 231, 0.22);
  --scrim: rgba(0, 0, 0, 0.6);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.40), 0 1px 1px rgba(0, 0, 0, 0.30);
  --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.40), 0 10px 24px rgba(0, 0, 0, 0.36);
  --shadow-3: 0 10px 20px rgba(0, 0, 0, 0.44), 0 28px 64px rgba(0, 0, 0, 0.56);
}

/* Base and browser surfaces */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; overflow-x: clip; }
html { -webkit-text-size-adjust: 100%; scrollbar-color: var(--scrollbar) transparent; scrollbar-width: thin; }
body {
  min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: var(--text-sm); line-height: var(--leading-body); font-weight: 400;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  caret-color: var(--accent); accent-color: var(--accent); touch-action: manipulation;
}
::selection { background: var(--selection); color: var(--text); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scrollbar); border: 3px solid transparent; border-radius: var(--radius-full); background-clip: padding-box; }
button, input, select, textarea { font-family: inherit; font-size: var(--text-sm); line-height: inherit; color: inherit; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 3px; text-underline-position: from-font; }
a:hover { color: var(--accent-hover); }
h1, h2, h3, p { margin: 0; }
code, .mono { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; }
.tabular, .num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link {
  position: fixed; left: var(--space-4); top: calc(-1 * var(--space-7)); z-index: 100;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
  background: var(--text); color: var(--bg); font-weight: 500; text-decoration: none;
  transition: top var(--dur-fast) var(--ease);
}
.skip-link:focus { top: var(--space-3); color: var(--bg); }
.svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.icon {
  width: 16px; height: 16px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
}
.icon-lg { width: 20px; height: 20px; }

/* App shell */
.app-shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; }
.mobile-bar { display: none; }
.rail {
  position: sticky; top: 0; height: 100vh; height: 100dvh; min-width: 0;
  display: flex; flex-direction: column;
  background: var(--bg); border-right: 1px solid var(--border);
}
.rail-brand {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-5) var(--space-4) var(--space-4); color: var(--text);
}
.rail-brand .icon { color: var(--accent); }
.rail-brand-text { display: flex; flex-direction: column; min-width: 0; }
.rail-brand-name {
  font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; line-height: var(--leading-snug);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rail-brand-sub { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); }
.rail-label {
  padding: 0 var(--space-4) var(--space-2);
  font-size: var(--text-xs); font-weight: 500; color: var(--muted);
}
.rail-nav { display: flex; flex-direction: column; gap: 2px; padding: var(--space-2) var(--space-2) var(--space-4); }
.rail-nav a, .rail-nav .tab {
  display: flex; align-items: center; gap: var(--space-3); width: 100%; min-height: 36px;
  padding: 0 var(--space-3); border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--text-2); font-size: var(--text-sm); font-weight: 500; text-align: left; text-decoration: none; cursor: pointer;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.rail-nav a:hover, .rail-nav .tab:hover { background: var(--surface-2); color: var(--text); }
.rail-nav a[aria-current="page"], .rail-nav .tab[aria-selected="true"] {
  background: var(--surface); color: var(--text); box-shadow: inset 2px 0 0 var(--accent), var(--shadow-1);
}
.rail-nav a[aria-current="page"] .icon { color: var(--accent); }
.rail-nav .count, .rail-nav .nav-count {
  margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400;
  font-variant-numeric: tabular-nums; color: var(--text-2);
}
.rail-facets {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: var(--space-4) 0; border-top: 1px solid var(--border);
}
.facet-list { display: flex; flex-direction: column; gap: 1px; padding: 0 var(--space-2); }
.facet {
  display: flex; align-items: center; gap: var(--space-2); width: 100%; min-height: 30px;
  padding: 0 var(--space-2); border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--text-2); font-size: var(--text-sm); font-weight: 400; text-align: left; cursor: pointer;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.facet:hover { background: var(--surface-2); color: var(--text); }
.facet[aria-pressed="true"] { background: var(--accent-soft); color: var(--ok-ink); font-weight: 500; }
.facet-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facet-count { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; font-variant-numeric: tabular-nums; }
.rail-footer {
  display: flex; flex-direction: column; gap: var(--space-3);
  margin-top: auto; padding: var(--space-4); border-top: 1px solid var(--border);
}
.readiness { display: flex; flex-direction: column; gap: var(--space-2); }
.readiness:empty { display: none; }
.readiness-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-2); }
.readiness-label { font-size: var(--text-xs); font-weight: 500; color: var(--muted); }
.readiness-value { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; font-variant-numeric: tabular-nums; color: var(--text); }
.readiness-meter { display: flex; gap: 2px; height: 6px; }
.readiness-meter i { flex: 1; border-radius: var(--radius-sm); background: var(--surface-3); }
.readiness-meter i.ok { background: var(--accent); }
.readiness-meter i.warn { background: var(--warn); }
.readiness-meter i.bad { background: var(--danger); }
.readiness-note { font-size: var(--text-xs); font-weight: 400; color: var(--text-2); }
.readiness.ok .readiness-note { color: var(--ok-ink); }
.readiness.warn .readiness-note { color: var(--warn); }
.readiness.bad .readiness-note { color: var(--danger); }
.counter {
  display: inline-flex; align-items: center; gap: var(--space-2);
  font-size: var(--text-xs); font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums;
}
.counter:empty { display: none; }
.counter.has { color: var(--warn); }
.path-copy {
  display: flex; align-items: center; gap: var(--space-2); width: 100%; min-width: 0; height: var(--control-h-sm);
  padding: 0 var(--space-2); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
  color: var(--text-2); font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; cursor: pointer;
  transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.path-copy:hover { border-color: var(--border-strong); color: var(--text); }
.path-copy span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.rail-controls { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.lang-switch { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); }
.lang-switch button {
  min-width: 34px; height: 24px; padding: 0 var(--space-2); border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--text-2); font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; cursor: pointer;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.lang-switch button:hover { color: var(--text); }
.lang-switch button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); font-weight: 500; }
.theme-toggle .i-sun-use, [data-theme="dark"] .theme-toggle .i-moon-use { display: none; }
[data-theme="dark"] .theme-toggle .i-sun-use { display: inline; }
.rail-reset { width: 100%; }

/* Workspace and page head */
.workspace { min-width: 0; max-width: 1440px; padding: var(--space-6) var(--space-7) 96px; }
.workspace:focus { outline: none; }
.page-head {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: var(--space-4) var(--space-5);
  padding-bottom: var(--space-5); margin-bottom: var(--space-5); border-bottom: 1px solid var(--border);
}
.page-title {
  font-family: var(--font-display); font-size: var(--text-display); font-weight: 600; line-height: var(--leading-tight);
  letter-spacing: -0.01em; color: var(--text); text-wrap: balance; overflow-wrap: anywhere;
}
.page-sub { margin-top: var(--space-2); max-width: 72ch; font-size: var(--text-sm); font-weight: 400; color: var(--text-2); text-wrap: pretty; }
.page-meta { margin-top: var(--space-2); font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); }
.page-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); }
.section-title {
  display: flex; align-items: baseline; gap: var(--space-3);
  font-family: var(--font-display); font-size: var(--text-xl); font-weight: 600; line-height: var(--leading-tight); letter-spacing: -0.01em;
}
.section-sub { margin: var(--space-1) 0 var(--space-5); font-size: var(--text-sm); font-weight: 400; color: var(--text-2); }
.loading-screen { display: grid; place-items: center; min-height: 50vh; font-size: var(--text-sm); font-weight: 400; color: var(--muted); }

/* Summary strip (Harnesses) */
.summary-strip {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  margin-bottom: var(--space-5); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.metric { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; padding: var(--space-3) var(--space-4); }
.metric + .metric { border-left: 1px solid var(--border); }
.metric-label { font-size: var(--text-xs); font-weight: 500; color: var(--muted); }
.metric-value {
  font-family: var(--font-mono); font-size: var(--text-xl); font-weight: 400; line-height: var(--leading-tight);
  font-variant-numeric: tabular-nums; color: var(--text);
}
.metric.ok .metric-value { color: var(--ok-ink); }
.metric.warn .metric-value { color: var(--warn); }
.metric.bad .metric-value { color: var(--danger); }

/* Filter bar */
.filter-bar, .toolbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
  padding: var(--space-3) 0; margin-bottom: var(--space-4);
}
.filter-bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--border);
}
.filter-meta { margin-left: auto; font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.search-box, .search { position: relative; flex: 1 1 280px; max-width: 420px; min-width: 0; }
.search-box > .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search-box .input { padding-left: 34px; padding-right: 40px; }
.search-box .kbd { position: absolute; right: var(--space-2); top: 50%; transform: translateY(-50%); pointer-events: none; }
.kbd {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 var(--space-1);
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2);
  font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; line-height: 1; color: var(--text-2);
}
.seg-control, .pills {
  display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 2px; min-height: var(--control-h);
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
}
.seg-control button, .pill {
  display: inline-flex; align-items: center; gap: var(--space-1); height: calc(var(--control-h) - 6px); padding: 0 var(--space-3);
  border: 0; border-radius: var(--radius-sm); background: transparent;
  color: var(--text-2); font-size: var(--text-sm); font-weight: 500; white-space: nowrap; cursor: pointer;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.seg-control button:hover, .pill:hover { color: var(--text); }
.seg-control button[aria-pressed="true"], .pill[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
.seg-control button[aria-pressed="true"] .n, .pill[aria-pressed="true"] .n, .lang-switch button[aria-pressed="true"] { color: var(--text); }
.seg-control .n, .pill .n { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--text-2); font-variant-numeric: tabular-nums; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: 32px; padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--text);
  font-size: var(--text-sm); font-weight: 500; white-space: nowrap; cursor: pointer; user-select: none;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease), transform .08s var(--ease);
}
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hover); }
.btn.danger { background: transparent; border-color: var(--border); color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: var(--danger-soft); border-color: var(--danger); }
.btn.danger-solid { background: var(--danger); border-color: transparent; color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn.sm { height: var(--control-h-sm); padding: 0 var(--space-2); font-size: var(--text-xs); }
.btn.add-btn { background: var(--surface); border-color: var(--border-strong); }
.btn.add-btn:hover:not(:disabled) { border-color: var(--text-2); }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; flex: none;
  border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent;
  color: var(--text-2); font-size: var(--text-sm); line-height: 1; cursor: pointer;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.icon-btn.danger:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }
.icon-btn:disabled { opacity: .45; cursor: not-allowed; }

/* Data table */
.data-table-wrap, .matrix-wrap { min-width: 0; overflow-x: auto; overscroll-behavior-x: contain; border-top: 1px solid var(--border-strong); }
.data-table, .matrix {
  width: 100%; border-collapse: collapse; border-spacing: 0;
  font-size: var(--text-sm); font-weight: 400; font-variant-numeric: tabular-nums;
}
.data-table th, .matrix th {
  padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--border);
  font-size: var(--text-xs); font-weight: 500;
  color: var(--muted); text-align: left; white-space: nowrap; vertical-align: bottom;
}
.data-table td, .matrix td {
  padding: var(--space-3); border-bottom: 1px solid var(--border);
  font-weight: 400; color: var(--text); vertical-align: middle;
}
.data-table tbody tr { transition: background-color var(--dur-fast) var(--ease); }
.data-table tbody tr:hover { background: var(--surface-2); }
.data-table tr[data-open], .data-table .row-link { cursor: pointer; }
.data-table tr.is-disabled td { color: var(--muted); }
.data-table tr td.stale-date, .data-table tr.is-disabled td.stale-date { color: var(--danger); }
.data-table tr.is-modified td:first-child, .matrix tr.changed td:first-child { box-shadow: inset 2px 0 0 var(--warn); }
.data-table tr.is-custom td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.data-table .col-num, .data-table .cell-num { text-align: right; font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; white-space: nowrap; }
.data-table .col-actions, .data-table .cell-actions { width: 1%; text-align: right; white-space: nowrap; }
.data-table .col-toggle, .data-table .cell-toggle { width: 1%; }
.cell-primary { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cell-name { font-weight: 500; color: var(--text); overflow-wrap: anywhere; }
.cell-id { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); overflow-wrap: anywhere; }
.cell-desc { max-width: 52ch; font-size: var(--text-sm); font-weight: 400; color: var(--text-2); }
.cell-mono { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--text-2); }
.matrix td.role { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; white-space: nowrap; }
.matrix .input { height: 30px; }

/* Status and badges */
.status-pill {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: var(--text-xs); font-weight: 500; color: var(--text-2);
}
.status-pill::before { content: ""; width: 6px; height: 6px; flex: none; border-radius: var(--radius-full); background: currentColor; }
.status-pill.ok { color: var(--ok-ink); }
.status-pill.warn { color: var(--warn); }
.status-pill.danger, .status-pill.bad { color: var(--danger); }
.status-pill.muted { color: var(--muted); }
.status-pill.muted::before { background: transparent; border: 1px solid currentColor; }
.badge {
  display: inline-flex; align-items: center; gap: var(--space-1); height: 20px; padding: 0 6px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent;
  font-size: var(--text-xs); font-weight: 500; color: var(--text-2); white-space: nowrap;
}
.badge.mono { font-family: var(--font-mono); font-weight: 400; }
.badge.accent, .badge.ok, .badge.custom { border-color: transparent; background: var(--accent-soft); color: var(--ok-ink); }
.badge.warn { border-color: transparent; background: var(--warn-soft); color: var(--warn); }
.badge.danger { border-color: transparent; background: var(--danger-soft); color: var(--danger); }
.badge.info { background: var(--surface-2); color: var(--text-2); }
.badge.outline { background: transparent; }
.tier-deep { border-color: var(--border-strong); color: var(--text); }
.tier-standard, .tier-light, .tier-specialist { color: var(--text-2); }
.cost-low { color: var(--ok-ink); }
.cost-medium { color: var(--text-2); }
.cost-high { color: var(--warn); }
.cost-premium { color: var(--danger); }
.dot { display: inline-block; width: 8px; height: 8px; flex: none; border-radius: var(--radius-full); background: var(--muted); }
.dot.default { background: var(--border-strong); }
.dot.overridden { background: var(--warn); }
.dot.custom, .dot.ok { background: var(--accent); }
.dot.bad { background: var(--danger); }
.dot.unknown { background: transparent; border: 1px solid var(--muted); }
.effort-pills { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.effort {
  padding: 0 6px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--text-2);
}
.effort.default { border-color: transparent; background: var(--accent-soft); color: var(--ok-ink); }
.banner {
  display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4);
  border-left: 2px solid var(--warn); border-radius: var(--radius-sm); background: var(--warn-soft);
  font-size: var(--text-sm); font-weight: 400; color: var(--text);
}
.banner > .icon { margin-top: 2px; color: var(--warn); }
.banner.danger { border-left-color: var(--danger); background: var(--danger-soft); }
.banner.danger > .icon { color: var(--danger); }
.banner.info { border-left-color: var(--border-strong); background: var(--surface-2); }
.banner.info > .icon { color: var(--text-2); }

/* Legacy card list (until Pass 2 replaces it with tables) */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); border-top: 1px solid var(--border-strong); }
.card {
  display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; padding: var(--space-4);
  border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: left; cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease);
}
.card:hover { background: var(--surface-2); }
.card.disabled { opacity: .62; }
.card.overridden { box-shadow: inset 2px 0 0 var(--warn); }
.card.custom { box-shadow: inset 2px 0 0 var(--accent); }
.card-head { display: flex; align-items: flex-start; gap: var(--space-3); }
.card-title { font-size: var(--text-base); font-weight: 500; line-height: var(--leading-snug); overflow-wrap: anywhere; }
.card-id { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); overflow-wrap: anywhere; }
.card-desc {
  font-size: var(--text-sm); font-weight: 400; color: var(--text-2);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card-foot { display: flex; align-items: center; gap: var(--space-2); margin-top: auto; padding-top: var(--space-1); font-size: var(--text-xs); font-weight: 400; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.grow { flex: 1; min-width: 0; }
.spacer { flex: 1; }
.toolbar-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-left: auto; }
.section-foot { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-5); }

/* Presets: master-detail */
.split-presets {
  display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); align-items: start;
  border-top: 1px solid var(--border-strong);
}
.preset-list { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
.preset-item {
  display: flex; flex-direction: column; gap: 2px; width: 100%; padding: var(--space-3) var(--space-4);
  border: 0; border-bottom: 1px solid var(--border); background: transparent; text-align: left; cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease);
}
.preset-item:hover { background: var(--surface-2); }
.preset-item[aria-current="true"] { background: var(--surface); box-shadow: inset 2px 0 0 var(--accent); }
.preset-item-name { font-size: var(--text-sm); font-weight: 500; color: var(--text); overflow-wrap: anywhere; }
.preset-item-meta { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); }
.preset-detail { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; padding: var(--space-4) 0 var(--space-4) var(--space-5); }
.preset-detail-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--space-3); }
.preset-detail-title { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 600; line-height: var(--leading-tight); overflow-wrap: anywhere; }
.preset-detail-desc { max-width: 72ch; font-size: var(--text-sm); font-weight: 400; color: var(--text-2); }

/* Limits */
.limits-layout { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-7); align-items: start; }
.limits-toc { position: sticky; top: var(--space-5); display: flex; flex-direction: column; gap: 2px; }
.limits-toc a {
  padding: 6px var(--space-2); border-radius: var(--radius-sm); color: var(--text-2);
  font-size: var(--text-sm); font-weight: 400; text-decoration: none;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.limits-toc a:hover { background: var(--surface-2); color: var(--text); }
.limits-toc a[aria-current="true"] { color: var(--text); font-weight: 500; box-shadow: inset 2px 0 0 var(--accent); }
.limits-section {
  display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: var(--space-3) var(--space-6);
  padding: var(--space-5) 0; border-top: 1px solid var(--border); scroll-margin-top: var(--space-5);
}
.limits-section:first-child { border-top-color: var(--border-strong); }
.limits-section-title { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; line-height: var(--leading-snug); }
.limits-section-desc { margin-top: var(--space-1); font-size: var(--text-sm); font-weight: 400; color: var(--text-2); }
.limits-fields { display: flex; flex-direction: column; min-width: 0; }
.setting-row {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(160px, 240px); align-items: start; gap: var(--space-2) var(--space-5);
  padding: var(--space-3) 0 var(--space-3) var(--space-3); border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: 0; }
.setting-row.is-modified { box-shadow: inset 2px 0 0 var(--warn); }
.setting-control { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }
.setting-unit { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.sticky-save-bar {
  position: sticky; bottom: var(--space-4); z-index: 6;
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
  margin-top: var(--space-5); padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-2);
}
.sticky-save-bar.is-dirty { border-color: var(--warn); }
.sticky-save-bar.is-invalid { border-color: var(--danger); }
.save-status { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); font-weight: 500; color: var(--text-2); }
.save-status .icon { color: var(--ok-ink); }
.save-status.is-dirty, .save-status.is-conflict { color: var(--warn); }
.save-status.is-dirty .icon, .save-status.is-conflict .icon { color: var(--warn); }
.save-status.is-saving { color: var(--text-2); }
.save-status.is-saving .icon { color: var(--text-2); }
.save-errors { flex: 1 1 100%; order: 3; display: flex; flex-direction: column; gap: 2px; margin: 0; padding: var(--space-2) 0 0; border-top: 1px solid var(--border); }
.save-errors[hidden] { display: none; }
.save-errors .field-error { margin: 0; }
.sticky-save-bar .save-actions, .drawer-foot .save-actions { display: flex; align-items: center; gap: var(--space-2); margin-left: auto; }
.save-hint { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); white-space: nowrap; }
.save-rule { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-2); max-width: 72ch; font-size: var(--text-xs); font-weight: 400; color: var(--text-2); }
.save-rule .icon { width: 14px; height: 14px; color: var(--ok-ink); }
.group { padding: var(--space-5) 0; border-top: 1px solid var(--border); }
.group-title { margin-bottom: var(--space-3); font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; line-height: var(--leading-snug); }
.settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 0 var(--space-6); align-items: start; }

/* Switch */
.switch { position: relative; display: inline-flex; align-items: center; gap: var(--space-2); flex: none; cursor: pointer; }
.switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.switch .track {
  position: relative; width: 32px; height: 18px; flex: none;
  border: 1px solid var(--switch-off); border-radius: var(--radius-full); background: var(--surface-3);
  transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.switch .thumb {
  position: absolute; top: 1px; left: 1px; width: 14px; height: 14px;
  border-radius: var(--radius-full); background: var(--switch-off);
  transition: transform var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track .thumb { transform: translateX(14px); background: var(--on-accent); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch input:disabled + .track { opacity: .45; }
.switch-label { font-size: var(--text-sm); font-weight: 400; color: var(--text-2); }

/* Forms */
.input {
  width: 100%; height: var(--control-h); padding: 0 10px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
  font-size: var(--text-sm); font-weight: 400;
  transition: border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.input::placeholder { color: var(--muted); }
.input:hover { border-color: var(--text-2); }
.input:focus { border-color: var(--accent); }
.input.mono { font-family: var(--font-mono); font-size: var(--text-xs); }
.input.num { font-family: var(--font-mono); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
.input.invalid, .input[aria-invalid="true"] { border-color: var(--danger); background: var(--danger-soft); }
.input:disabled { opacity: .55; cursor: not-allowed; }
textarea.input { height: auto; min-height: 64px; padding: var(--space-2) 10px; line-height: 1.45; resize: vertical; }

/* Select-only combobox (replaces the native select so the OS popup never appears) */
.select-wrap { position: relative; min-width: 0; }
.select-trigger {
  display: flex; align-items: center; gap: var(--space-2); width: 100%; height: var(--control-h); padding: 0 var(--space-2) 0 10px;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text);
  font-size: var(--text-sm); font-weight: 400; text-align: left; cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.select-trigger:hover:not(:disabled) { border-color: var(--text-2); }
.select-trigger:focus-visible, .select-trigger[aria-expanded="true"] { border-color: var(--accent); }
.select-trigger:disabled { opacity: .55; cursor: not-allowed; }
.select-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.select-label.is-placeholder { color: var(--muted); }
.select-chevron { color: var(--text-2); transition: transform var(--dur-fast) var(--ease); }
.select-trigger[aria-expanded="true"] .select-chevron { transform: rotate(180deg); }
.select-menu {
  position: absolute; top: calc(100% + 2px); left: 0; z-index: 60; box-sizing: border-box;
  min-width: 100%; width: max-content; max-width: min(420px, calc(100vw - 16px)); max-height: 240px; overflow-y: auto; overscroll-behavior: contain;
  margin: 0; padding: var(--space-1); list-style: none;
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); box-shadow: var(--shadow-2);
}
.select-menu.open-up { top: auto; bottom: calc(100% + 2px); }
.select-option {
  display: flex; align-items: center; gap: var(--space-2); min-height: 30px; padding: 0 var(--space-2);
  border-radius: var(--radius-sm); font-size: var(--text-sm); font-weight: 400; cursor: pointer; user-select: none;
}
.select-option .icon { color: var(--ok-ink); visibility: hidden; }
.select-option-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.select-option:hover { background: var(--surface-2); }
.select-option[aria-selected="true"] { background: var(--accent-soft); color: var(--ok-ink); font-weight: 500; }
.select-option[aria-selected="true"] .icon { visibility: visible; }
.select-option.is-active { outline: 2px solid var(--accent); outline-offset: -2px; }
@supports (anchor-name: --a) {
  .select-trigger.is-anchor-open { anchor-name: --select-anchor; }
  .select-menu {
    position: fixed; inset: auto; margin: 2px 0; width: max-content; min-width: anchor-size(width);
    position-anchor: --select-anchor; top: anchor(bottom); left: anchor(left);
    position-try-fallbacks: flip-block, flip-inline;
  }
}
.input-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.input-row > .input { flex: 1 1 120px; min-width: 0; width: auto; }
.input-row > .btn { flex: none; height: var(--control-h); padding: 0 var(--space-3); }
.input-row > .field-hint { flex: none; white-space: nowrap; }
.setting-control .input-row { flex-wrap: nowrap; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.field-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); min-height: 22px; }
.field-label { font-size: var(--text-sm); font-weight: 500; color: var(--text); }
.field-key { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); }
.field-hint { font-size: var(--text-xs); font-weight: 400; color: var(--text-2); }
.field-error { font-size: var(--text-xs); font-weight: 500; color: var(--danger); }
.field .reset-field { margin-left: auto; }
.mod-mark { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-xs); font-weight: 500; color: var(--warn); }
.mod-mark .dot { width: 6px; height: 6px; }
.default-hint {
  padding: 6px var(--space-2); border-radius: var(--radius-sm); background: var(--surface-2);
  font-size: var(--text-xs); font-weight: 400; color: var(--text-2); white-space: pre-line; overflow-wrap: anywhere;
}
.default-hint.changed { border-left: 2px solid var(--warn); background: var(--warn-soft); color: var(--text); }
.default-hint b { font-weight: 500; color: var(--text); }
.conflict {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2);
  padding: var(--space-3); border-left: 2px solid var(--danger); border-radius: var(--radius-sm); background: var(--danger-soft);
}
.conflict-label { font-size: var(--text-xs); font-weight: 500; color: var(--danger); }
.conflict-value { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--text); overflow-wrap: anywhere; }
.sub-title, .drawer-section-title {
  padding-bottom: var(--space-2); border-bottom: 1px solid var(--border);
  font-size: var(--text-xs); font-weight: 500; color: var(--muted);
}

/* Chips and list editor */
.chips {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1); min-height: var(--control-h); padding: var(--space-1);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm); background: var(--surface);
  transition: border-color var(--dur-fast) var(--ease);
}
.chips:focus-within { border-color: var(--accent); outline: 2px solid var(--accent); outline-offset: 2px; }
.chip {
  display: inline-flex; align-items: center; gap: 2px; height: 24px; padding: 0 2px 0 var(--space-2);
  border-radius: var(--radius-sm); background: var(--surface-3); color: var(--text);
  font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; animation: pop .16s var(--ease);
}
.chip.default-effort { background: var(--accent-soft); color: var(--ok-ink); }
.chip button {
  display: inline-grid; place-items: center; width: 20px; height: 20px; border: 0; border-radius: var(--radius-sm);
  background: none; color: var(--text-2); line-height: 1; cursor: pointer;
  transition: color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease);
}
.chip button:hover { background: var(--danger-soft); color: var(--danger); }
.chips input {
  flex: 1; min-width: 110px; height: 24px; border: 0; background: none; outline: none;
  font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400;
}
.suggest { display: flex; flex-wrap: wrap; gap: var(--space-1); }
.suggest button {
  height: 22px; padding: 0 var(--space-2); border: 1px dashed var(--border-strong); border-radius: var(--radius-sm); background: none;
  color: var(--text-2); font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; cursor: pointer;
  transition: color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
}
.suggest button:hover { border-color: var(--accent); color: var(--accent); }
.list-editor { display: flex; flex-direction: column; gap: 6px; }
.list-item { display: flex; align-items: flex-start; gap: 6px; animation: pop .16s var(--ease); }
.list-item .bullet {
  display: inline-grid; place-items: center; flex: none; align-self: flex-start; width: 18px; height: var(--control-h);
  font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted);
}
.list-item textarea.input {
  height: auto; min-height: var(--control-h); flex: 1 1 auto; min-width: 0; line-height: 1.4; padding-block: 6px;
  padding-block: calc((var(--control-h) - 2px - 1lh) / 2); field-sizing: content;
}
.list-item .icon-btn { align-self: flex-start; width: var(--control-h); height: var(--control-h); }
.argv-row { display: flex; align-items: center; gap: 6px; min-width: 0; animation: pop .16s var(--ease); }
.argv-row > .input { flex: 1 1 auto; min-width: 0; height: var(--control-h); }
.argv-row .icon-btn { width: var(--control-h); height: var(--control-h); }
.argv-row .icon-btn.flip .icon { transform: rotate(180deg); }
.control-stack { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-hint.warn { color: var(--warn); }
.quarantine-list { margin: var(--space-1) 0 0; padding-left: var(--space-4); font-size: var(--text-xs); color: var(--text-2); }
.quarantine-list li + li { margin-top: var(--space-2); }
.quarantine-list .btn { margin-left: var(--space-2); vertical-align: middle; }
.banner-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
.drawer:focus { outline: none; }

/* Health */
.health {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px var(--space-3); padding: var(--space-3) 0;
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: var(--text-sm); font-weight: 400;
}
.health dt { font-size: var(--text-xs); font-weight: 500; color: var(--muted); }
.health dd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; margin: 0; overflow-wrap: anywhere; }
.skeleton {
  width: 70%; height: 12px; border-radius: var(--radius-sm);
  background: linear-gradient(90deg, var(--surface-3), var(--surface-2), var(--surface-3)); background-size: 200% 100%;
  animation: shimmer 1.2s infinite linear;
}

/* Drawer */
.scrim {
  position: fixed; inset: 0; z-index: 40; background: var(--scrim);
  opacity: 0; pointer-events: none; transition: opacity var(--dur-mid) var(--ease);
}
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 50; width: var(--drawer-w);
  display: flex; flex-direction: column;
  background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--shadow-3);
  transform: translateX(100%); visibility: hidden;
  transition: transform var(--dur-mid) var(--ease), visibility 0s linear var(--dur-mid);
}
.drawer.open { transform: none; visibility: visible; transition: transform var(--dur-mid) var(--ease), visibility 0s; }
.drawer-head {
  display: flex; align-items: flex-start; gap: var(--space-3);
  padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--border);
}
.drawer-title {
  font-family: var(--font-display); font-size: var(--text-xl); font-weight: 600; line-height: var(--leading-tight);
  letter-spacing: -0.01em; overflow-wrap: anywhere;
}
.drawer-meta { margin-top: var(--space-1); font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); overflow-wrap: anywhere; }
.drawer-body {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-5) var(--space-5) var(--space-6);
}
.drawer-body > * { flex-shrink: 0; }
.drawer-foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2);
  padding: var(--space-3) var(--space-5); border-top: 1px solid var(--border); background: var(--bg);
}
.foot-reset { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-1); }
.foot-note { max-width: 30ch; font-size: var(--text-xs); font-weight: 400; color: var(--text-2); }

/* Discovery drawer */
.discover-controls { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); margin-top: var(--space-3); }
.discover-controls .select-wrap { width: 200px; max-width: 100%; }
.drawer-body.discover-body { gap: var(--space-3); padding-top: 0; }
.discover-notes { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-4); padding-top: var(--space-4); }
.discover-banner-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
.discover-filters {
  position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3);
  padding: var(--space-3) 0; background: var(--surface); border-bottom: 1px solid var(--border);
}
.discover-filters .search-box { flex: 1 1 180px; max-width: none; }
.discover-filters .select-wrap { width: 180px; max-width: 100%; }
.ledger { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--border-strong); }
.ledger-item { border-bottom: 1px solid var(--border); }
.ledger-row { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: start; gap: var(--space-3); padding: var(--space-3) var(--space-2); }
label.ledger-row { cursor: pointer; }
label.ledger-row:hover { background: var(--surface-2); }
.ledger-row.is-selected { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.ledger-row.is-passive { color: var(--text-2); }
.ledger-check { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--accent); cursor: pointer; }
.ledger-check:disabled { cursor: not-allowed; }
.ledger-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ledger-id { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 500; color: var(--text); overflow-wrap: anywhere; }
.ledger-route { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--muted); overflow-wrap: anywhere; }
.ledger-meta { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); }
.ledger-meta-line { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: var(--space-1) var(--space-2); }
.ledger-context { font-family: var(--font-mono); font-size: var(--text-xs); font-weight: 400; color: var(--text-2); font-variant-numeric: tabular-nums; }
.ledger-evidence { font-size: var(--text-xs); font-weight: 400; color: var(--muted); }
.drawer-foot .discover-summary { font-size: var(--text-sm); font-weight: 500; color: var(--text-2); }
.drawer-foot .discover-summary.has-selection { color: var(--text); }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Confirm dialog */
dialog {
  width: min(480px, calc(100vw - 32px)); padding: 0; overscroll-behavior: contain;
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  background: var(--surface); color: var(--text); box-shadow: var(--shadow-3);
}
dialog::backdrop { background: var(--scrim); }
dialog[open] { animation: rise var(--dur-mid) var(--ease); }
.dialog-body { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-5) var(--space-5) var(--space-2); }
.dialog-body h2 { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; line-height: var(--leading-snug); }
.dialog-body p { font-size: var(--text-sm); font-weight: 400; color: var(--text-2); }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-4) var(--space-5) var(--space-5); }

/* Toasts */
.toasts {
  position: fixed; top: var(--space-4); left: 50%; z-index: 80; transform: translateX(-50%);
  display: flex; flex-direction: column; gap: var(--space-2); width: min(420px, calc(100vw - 32px)); pointer-events: none;
}
.toast {
  display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3) var(--space-4);
  border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-2);
  font-size: var(--text-sm); font-weight: 400; animation: rise var(--dur-mid) var(--ease); pointer-events: auto;
}
.toast > .icon { margin-top: 2px; color: var(--text-2); }
.toast.ok > .icon { color: var(--ok-ink); }
.toast.error > .icon { color: var(--danger); }
.toast.leaving { opacity: 0; transform: translateY(6px); transition: opacity .2s var(--ease), transform .2s var(--ease); }
.toast .dot { margin-top: 6px; }
.toast .details { margin: var(--space-1) 0 0; padding-left: var(--space-4); font-size: var(--text-xs); font-weight: 400; color: var(--text-2); }
.toast strong { font-weight: 500; }

/* Empty state */
.empty-state, .empty {
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
  padding: var(--space-7) var(--space-5); text-align: center;
  border: 1px dashed var(--border-strong); border-radius: var(--radius-lg);
  font-size: var(--text-sm); font-weight: 400; color: var(--text-2);
}
.empty-state > .icon { width: 20px; height: 20px; color: var(--muted); }
.empty-title { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 600; color: var(--text); }
.empty-text { max-width: 48ch; font-size: var(--text-sm); font-weight: 400; color: var(--text-2); }
.empty-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-2); margin-top: var(--space-2); }

/* Pass 2 helpers */
.cell-button {
  padding: 0; border: 0; border-radius: var(--radius-sm); background: none; color: inherit; text-align: left; cursor: pointer;
  text-decoration-thickness: 1px; text-underline-offset: 3px;
}
.cell-button:hover { text-decoration-line: underline; }
.cell-flags { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); min-width: 0; }
.cell-trunc { display: block; max-width: 28ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-trailing { display: contents; }
.search-box .search-clear { position: absolute; right: 2px; top: 50%; width: 30px; height: 30px; transform: translateY(-50%); }
.readiness-link { display: flex; flex-direction: column; gap: var(--space-2); border-radius: var(--radius-sm); color: inherit; text-decoration: none; }
.readiness-link:hover { color: inherit; }
.readiness-link:hover .readiness-value { text-decoration-line: underline; }
.toast.warn > .icon { color: var(--warn); }
.preset-item-row { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }
.preset-detail-title.mono { font-family: var(--font-mono); font-size: var(--text-lg); font-weight: 500; letter-spacing: 0; }
.limits-sections { min-width: 0; }
.input-row > .setting-unit { flex: none; white-space: nowrap; }

@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

/* Responsive */
@media (max-width: 1180px) {
  .workspace { padding: var(--space-6) var(--space-6) 96px; }
  .limits-layout { grid-template-columns: minmax(0, 1fr); gap: var(--space-4); }
  .limits-toc { position: static; flex-direction: row; flex-wrap: wrap; }
}
@media (max-width: 960px) {
  .app-shell { grid-template-columns: minmax(0, 1fr); }
  .mobile-bar {
    position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: var(--space-3);
    height: var(--bar-h); padding: 0 var(--space-3); background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .mobile-brand { display: flex; align-items: center; gap: var(--space-2); min-width: 0; font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; }
  .mobile-brand .icon { color: var(--accent); }
  .mobile-brand span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rail {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 45; width: min(300px, 86vw); height: auto;
    box-shadow: var(--shadow-3); transform: translateX(-100%); visibility: hidden;
    transition: transform var(--dur-mid) var(--ease), visibility 0s linear var(--dur-mid);
  }
  .rail.open { transform: none; visibility: visible; transition: transform var(--dur-mid) var(--ease), visibility 0s; }
  .workspace { padding: var(--space-5) var(--space-4) 96px; }
  .filter-bar { top: var(--bar-h); }
  .page-head { grid-template-columns: minmax(0, 1fr); align-items: start; }
  .page-title { font-size: var(--text-xl); }
  .split-presets { grid-template-columns: minmax(0, 1fr); }
  .preset-list { border-right: 0; }
  .preset-detail { padding: var(--space-4) 0; }
  .limits-section { grid-template-columns: minmax(0, 1fr); scroll-margin-top: calc(var(--bar-h) + var(--space-3)); }
}
@media (max-width: 720px) {
  .fields, .setting-row, .conflict { grid-template-columns: minmax(0, 1fr); }
  .search-box, .search { max-width: none; flex-basis: 100%; }
  .filter-meta { margin-left: 0; }
  .metric + .metric { border-left: 0; }
  .summary-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .data-table.stack thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .data-table.stack, .data-table.stack tbody, .data-table.stack tr, .data-table.stack td { display: block; width: 100%; }
  .data-table.stack tr { padding: var(--space-3) 0; border-bottom: 1px solid var(--border); }
  .data-table.stack td { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-1) 0; border-bottom: 0; text-align: right; }
  .data-table.stack td::before {
    content: attr(data-label); flex: none; text-align: left;
    font-size: var(--text-xs); font-weight: 500; color: var(--muted);
  }
  .data-table.stack td.cell-main { display: block; text-align: left; }
  .ledger-row { grid-template-columns: 16px minmax(0, 1fr); }
  .ledger-meta { grid-column: 2; align-items: flex-start; }
  .ledger-meta-line { justify-content: flex-start; }
  .data-table.stack td.cell-main::before { content: none; }
  .data-table.stack .col-actions, .data-table.stack .cell-actions { width: 100%; }
  .btn-label-long { display: none; }
  .toasts { top: calc(var(--bar-h) + var(--space-2)); }
  .input, .input.mono, .input.num, textarea.input, .chips input, .select-trigger { font-size: var(--text-base); }
}
@media (pointer: coarse) {
  .btn, .icon-btn, .rail-nav a, .rail-nav .tab, .facet, .lang-switch button, .select-trigger, .select-option, .switch, .chip button,
  .seg-control button, .suggest button, .path-copy { min-height: var(--touch-target); }
  .icon-btn, .lang-switch button, .switch, .chip button { min-width: var(--touch-target); }
  .switch { justify-content: center; }
  .chip { height: auto; min-height: var(--touch-target); }
  .chips input { height: var(--touch-target); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important; animation-iteration-count: 1 !important;
    transition-duration: .01ms !important; transition-delay: 0s !important; scroll-behavior: auto !important;
  }
}
</style>

const RUSSIAN_PATTERNS = [
  [/^Request body exceeds (\d+) bytes$/, "Request body exceeds {0} bytes"],
  [/^At most (\d+) models can be imported per request \(got (\d+)\)\.$/, "At most {0} models can be imported per request (got {1})."],

function russianForPattern(english) {
  for (const [matcher, key] of RUSSIAN_PATTERNS) {
    const match = matcher.exec(english);
    if (match) return russian[key].replace(/\{(\d+)\}/g, (_, index) => match[Number(index) + 1]);
  }
  return null;
}

function t(english, ...values) {
  let pattern = english;
  if (language === "ru") pattern = Object.hasOwn(russian, english) ? russian[english] : (russianForPattern(english) ?? english);
  return values.length ? pattern.replace(/\{(\d+)\}/g, (_, index) => String(values[index])) : pattern;
}
