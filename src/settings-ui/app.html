/** Optional strings are either set or absent; a blank CLI model means "use the model ID", never an empty string. */
function cleanModelDraft(draft) {
  const out = dropBlankOptionals(draft, ["cli_model", "cli_provider", "vendor_family"]);
  if (out.context_window === "" || out.context_window === null) delete out.context_window;
  if (out.checked_at === "" || out.checked_at === null) delete out.checked_at;
  for (const key of ["strengths", "weaknesses", "best_for", "avoid_for"]) out[key] = (out[key] || []).map((item) => item.trim()).filter(Boolean);
  return out;
}

/** The first reason a cleaned model draft cannot be saved, already translated, or null. */
function modelDraftProblem(draft) {
  if (!draft.display_name || !draft.display_name.trim()) return t("Enter a model name.");
  const optional = modelMayOmitCardFacts(draft);
  const context = draft.context_window;
  if (context === undefined ? !optional : (!Number.isInteger(context) || context <= 0)) return t("The context window must be a positive whole number of tokens.");
  if (draft.checked_at === undefined && !optional) return t("Enter the date the card was last checked.");
  if (!draft.efforts || !draft.efforts.length) return t("Add at least one effort level.");
  return null;
}

/**
 * A provider/model route that the driver cannot use, already translated, or null. Checked for new models and whenever the harness,
 * CLI model or CLI provider changed, so a legacy card is not blocked from saving an unrelated edit.
 */
function modelRouteProblem(drawer, draft) {
  const advice = modelHints(drawer)["provider-prefix"];
  if (!advice) return null;
  const original = drawer.original;
  const touched = drawer.isNew || ["harness", "cli_model", "cli_provider"].some((key) => (draft[key] || "") !== (original[key] || ""));
  return touched ? advice : null;
}

async function saveModel() {
  const drawer = state.drawer;
  const draft = cleanModelDraft(drawer.draft);
  const problem = modelDraftProblem(draft) || modelRouteProblem(drawer, draft);
  if (problem) { toast("error", () => problem); return; }
  let id = drawer.id;
  let patch;
  if (drawer.isNew) {
    id = validateNewId("models");
    if (!id) return;
    patch = { ...draft, custom: true };
  } else {
    // The stored card shows the model ID as its CLI model when none is set, so a blank field there is not a change.
    const original = draft.cli_model === undefined && drawer.original.cli_model === id ? (({ cli_model: _implicit, ...rest }) => rest)(drawer.original) : drawer.original;
    patch = buildPatch(original, draft, MODEL_OPTIONAL_KEYS);
    if (!Object.keys(patch).length) { toast("info", () => t("No changes")); return; }
  }
  if (await mutate("PUT", `/api/models/${encodeURIComponent(id)}`, { patch }, () => drawer.isNew ? t("Model added") : t("Model saved"))) {
    if (state.drawer === drawer) openDrawer("model", id);
  }
}

  const modes = Object.hasOwn(state.driverMeta, driver) ? state.driverMeta[driver].writePermissionModes : null;

  draft.driver = driver;

        { fk: "h-max_concurrency", type: "number", min: 1, max: MAX_CONCURRENCY_LIMIT, placeholder: t("CLI limit, else {0}", defaultConcurrency) }),
      { hint: t("Leave empty to use the CLI's own limit, then the global default.") }),
      props("model_discovery", t("Model discovery"), selectBox([["", t("Default (native for built-in, manual for custom)")],
        ...MODEL_DISCOVERY_MODES.map((mode) => [mode, t(mode)])], d.model_discovery || "", (v) => setDraft("model_discovery", v || undefined),
      { fk: "h-model_discovery", label: t("Model discovery") }), { hint: t("How this harness's model list is found: typed by hand, listed by the CLI, or listed by a wrapper script.") }),
      props("enabled", t("Enabled"), toggle(d.enabled, (v) => setDraft("enabled", v), { fk: "h-enabled", label: t("Enabled"), text: d.enabled ? t("Available for plans") : t("Disabled") })),
      props("extra_args", t("Additional CLI arguments"), argvEditor(d.extra_args || [], (v, rerender = true) => setDraft("extra_args", v, rerender),
        { fk: "h-extra_args", placeholder: t("--flag or value, Enter") }),
      { wide: true, hint: t("One CLI argument per row (flag and value as separate rows, e.g. -c then key=val).") })),
  ];
  return drawerShell({
    title: drawer.isNew ? (drawer.deletedElsewhere ? (d.display_name || drawer.newId) : t("New harness")) : entity.display_name,
    subtitle: drawer.isNew ? null : drawer.id,
    badges: entity ? [provenanceBadge(entity.provenance), badge(entity.driver, "mono accent"), contractBadge(entity.driver)] : [],
    body, entity, kindLabel: t("harness"), isCustom,
    onReset: () => resetEntity("harness", drawer.id, isCustom, entity.display_name),
    onSave: () => void saveHarness(),
  });
}

/** The first reason a cleaned harness draft cannot be saved, already translated, or null. */
function harnessDraftProblem(draft) {
  if (!draft.display_name || !draft.binary) return t("Enter a name and an executable.");
  const limit = draft.max_concurrency;
  if (limit !== undefined && (!Number.isInteger(limit) || limit < 1 || limit > MAX_CONCURRENCY_LIMIT)) {
    return t("Max parallel jobs must be a whole number from 1 to {0}.", MAX_CONCURRENCY_LIMIT);
  }
  return null;
}

function cleanHarnessDraft(draft) {
  const out = dropBlankOptionals(draft, ["binary", "display_name", "profile", "default_upstream_provider", "write_permission_mode", "model_discovery"]);
  if (out.max_concurrency === "" || out.max_concurrency === null) delete out.max_concurrency;
  // One token per row: only empty rows are dropped; whitespace-only or padded tokens are literal arguments and stay as typed.
  if (out.extra_args) out.extra_args = out.extra_args.filter((token) => token !== "");
  return out;
}

async function saveHarness() {
  const drawer = state.drawer;
  const draft = cleanHarnessDraft(drawer.draft);
  const problem = harnessDraftProblem(draft);
  if (problem) { toast("error", () => problem); return; }
  let id = drawer.id;
  let patch;
  if (drawer.isNew) {
    id = validateNewId("harnesses");
    if (!id) return;
    patch = { ...draft, custom: true };
  } else {
    patch = buildPatch(drawer.original, draft, HARNESS_OPTIONAL_KEYS);
    if (!Object.keys(patch).length) { toast("info", () => t("No changes")); return; }
  }
  if (await mutate("PUT", `/api/harnesses/${encodeURIComponent(id)}`, { patch }, () => drawer.isNew ? t("Harness added") : t("Harness saved"))) {
    if (state.drawer === drawer) openDrawer("harness", id);
    // A saved harness must be probed afresh; any probe still running used the old configuration.
    void loadHealth(true, { quiet: true });
  }
}

// ---------------------------------------------------------------------------
// Model discovery drawer: scan, review, then import atomically (NEW in Wave 3)
// ---------------------------------------------------------------------------
/** Mirrors MAX_APPLY_BATCH in src/discovery/types.ts: the server rejects a larger import. */
const MAX_IMPORT_SELECTION = 50;
/** The review list never renders more rows than this; the filters narrow the rest. */
const DISCOVERY_RENDER_LIMIT = 200;
/** Provider filter value that matches every provider. */
const ALL_PROVIDERS = "";
/** Scope value for "scan every harness". An empty string can never be a harness ID, so a harness literally named "all" stays selectable. */
const ALL_HARNESSES = "";
const DISCOVERY_MODE_OPTIONS = [["on_demand", "On-demand (CLI + local)"], ["offline", "Offline (local config only)"]];
const DISCOVERY_STATUS_FILTERS = [["all", "All"], ["new", "New"], ["disabled_in_catalog", "Disabled in catalog"], ["already_configured", "Already configured"]];
const DISCOVERY_STATUS_LABEL = { new: "New", disabled_in_catalog: "Disabled in catalog", already_configured: "Already enabled", ambiguous: "Ambiguous" };
const DISCOVERY_STATUS_PILL = { new: "ok", disabled_in_catalog: "warn", already_configured: "muted", ambiguous: "warn" };
const DISCOVERY_QUALITY_LABEL = { template: "Template", baseline: "Baseline", curated: "Curated" };
const DISCOVERY_QUALITY_HINT = {
  template: "Card copied from a matching built-in model",
  baseline: "Generic starting card; review its details after importing",
  curated: "Reviewed card",
};
const DISCOVERY_EVIDENCE_LABEL = { cli_listing: "CLI listing", local_config: "Local config", local_cache: "Local cache" };
/** Diagnostic code -> [pill kind, English label]. Unknown codes show the raw code. */
const DISCOVERY_DIAGNOSTIC_LABEL = {
  manual_only: ["muted", "Manual only (custom wrapper)"],
  binary_missing: ["danger", "CLI not found"],
  timeout: ["warn", "Timed out"],
  unsupported_version: ["warn", "Unsupported CLI version"],
  scope_unknown: ["muted", "Scope unknown"],
  cancelled: ["warn", "Cancelled"],
  busy: ["warn", "Already scanning"],
  output_limit: ["warn", "Output too large"],
  invalid_output: ["warn", "Unreadable output"],
  source_unreadable: ["warn", "Local source unreadable"],
};

function newDiscoveryState(scope) {
  return {
    harness: scope, mode: "on_demand", preview: null, scanned: null, scanning: false, scanSeq: 0, controller: null, saving: false,
    /** "conflict" | "expired" once an import found the preview stale; cleared only by a SUCCESSFUL rescan with the current options. */
    locked: null,
    selected: new Set(), query: "", status: "all", provider: ALL_PROVIDERS, banner: null, error: "",
  };
}

function isDiscoveryDrawer(drawer) {
  return Boolean(drawer && drawer.kind === "discover");
}

/** Only a new model (import) or a disabled built-in card (enable) can be selected. */
function isActionableCandidate(candidate) {
  return candidate.action === "import" || candidate.action === "enable";
}

function discoveryProviders(candidates) {
  return [...new Set(candidates.map((candidate) => candidate.discovered.cli_provider).filter(Boolean))].sort();
}

function discoveryStatusCounts(candidates) {
  const counts = { all: candidates.length, new: 0, disabled_in_catalog: 0, already_configured: 0 };
  for (const candidate of candidates) if (Object.hasOwn(counts, candidate.status)) counts[candidate.status] += 1;
  return counts;
}

function candidateMatches(candidate, { query, status, provider }) {
  if (status !== "all" && candidate.status !== status) return false;
  if (provider !== ALL_PROVIDERS && (candidate.discovered.cli_provider || "") !== provider) return false;
  const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return true;
  const haystack = [candidate.proposed_id, candidate.harness, candidate.discovered.cli_model, candidate.discovered.cli_provider, candidate.discovered.display_name]
    .filter(Boolean).join(" ").toLowerCase();
  return words.every((word) => haystack.includes(word));
}

function visibleCandidates(d) {
  return d.preview.candidates.filter((candidate) => candidateMatches(candidate, d));
}

/** Context window as the table shows it (272K, 1M), with "~" when the CLI only reported a rounded figure, or "—" when unknown. */
function discoveryContext(discovered) {
  const text = formatContext(discovered.context_window);
  return text !== "—" && discovered.context_precision === "rounded" ? `~${text}` : text;
}

/** Keeps the selected keys that still name an actionable candidate (at most the batch limit); `dropped` counts the rest. */
function reconcileSelection(selected, candidates) {
  const actionable = new Set(candidates.filter(isActionableCandidate).map((candidate) => candidate.key));
  const kept = [...selected].filter((key) => actionable.has(key)).slice(0, MAX_IMPORT_SELECTION);
  return { kept: new Set(kept), dropped: selected.size - kept.length };
}

function selectionSummary(candidates, selected) {
  const byKey = new Map(candidates.map((candidate) => [candidate.key, candidate]));
  let fresh = 0;
  let enable = 0;
  for (const key of selected) {
    const candidate = byKey.get(key);
    if (!candidate) continue;
    if (candidate.action === "import") fresh += 1;
    else if (candidate.action === "enable") enable += 1;
  }
  return { total: fresh + enable, fresh, enable };
}

/** "clear" when something is selected and every visible actionable row is already in it; otherwise "select". */
function selectionToggleMode(selected, visible) {
  const actionable = visible.filter(isActionableCandidate);
  if (!selected.size) return "select";
  return actionable.every((candidate) => selected.has(candidate.key)) ? "clear" : "select";
}

/** Adds visible actionable rows up to the batch limit; `capped` says some rows did not fit. */
function selectActionable(selected, visible) {
  const next = new Set(selected);
  let capped = false;
  for (const candidate of visible) {
    if (!isActionableCandidate(candidate) || next.has(candidate.key)) continue;
    if (next.size >= MAX_IMPORT_SELECTION) { capped = true; break; }
    next.add(candidate.key);
  }
  return { selected: next, capped };
}

/** One note per harness and problem: [{ kind, harness, label (English), title }]. */
function discoveryDiagnosticNotes(preview) {
  const notes = [];
  const seen = new Set();
  const add = (harness, code, kind, label, title) => {
    const id = `${harness}|${code}`;
    if (seen.has(id)) return;
    seen.add(id);
    notes.push({ kind, harness, label, title: title || null });
  };
  for (const result of preview.harnesses || []) {
    const diagnostics = result.diagnostics || [];
    for (const diagnostic of diagnostics) {
      const known = Object.hasOwn(DISCOVERY_DIAGNOSTIC_LABEL, diagnostic.code) ? DISCOVERY_DIAGNOSTIC_LABEL[diagnostic.code] : null;
      add(result.harness, diagnostic.code, known ? known[0] : "warn", known ? known[1] : diagnostic.code, diagnostic.message);
    }
    if (result.status === "unsupported" && !diagnostics.length) add(result.harness, "unsupported", "muted", "Unsupported");
    if (result.truncated) add(result.harness, "truncated", "warn", "Truncated");
  }
  return notes;
}

/** What a failed import means for the open drawer: a stale preview, an expired preview, or a plain error. */
function discoveryImportFailure(error) {
  if (error.status === 409) return { kind: "conflict" };
  if (error.status === 410) return { kind: "expired" };
  return { kind: "error", text: error.message };
}

function discoveryTitle(d) {
  if (d.harness === ALL_HARNESSES) return t("Discover models");
  const harness = state.snap && Object.hasOwn(state.snap.harnesses, d.harness) ? state.snap.harnesses[d.harness] : null;
  return t("Discover models — {0}", harness ? harness.display_name : d.harness);
}

function discoveryHarnessOptions() {
  const entries = Object.entries(state.snap.harnesses).map(([id, harness]) => {
    const name = harness.display_name === id ? id : `${harness.display_name} (${id})`;
    return [id, harness.enabled ? name : t("{0} (disabled)", name)];
  });
  return [[ALL_HARNESSES, t("All enabled harnesses")], ...entries];
}

/** Opens the discovery drawer scoped to `harness` (ALL_HARNESSES = every harness). Nothing is scanned until the user presses Scan. */
function openDiscoveryDrawer(harness = ALL_HARNESSES) {
  if (!state.snap) return;
  if (!state.drawer) {
    const active = document.activeElement;
    state.drawerReturn = {
      element: active && active !== document.body ? active : null,
      key: (active && active.dataset ? active.dataset.fk : null) || "discover-models",
    };
  }
  const scope = harness !== ALL_HARNESSES && Object.hasOwn(state.snap.harnesses, harness) ? harness : ALL_HARNESSES;
  state.drawer = { kind: "discover", id: null, isNew: false, original: {}, draft: {}, conflicts: [], deletedElsewhere: false, pending: {}, discovery: newDiscoveryState(scope) };
  render();
  requestAnimationFrame(focusDrawerStart);
}

/** From a saved harness drawer: unsaved edits are never dropped silently. */
async function discoverFromHarnessDrawer() {
  const drawer = state.drawer;
  if (!drawer || drawer.kind !== "harness" || drawer.isNew || !drawer.id) return;
  if (drawerDirty()) {
    const ok = await confirmDialog({
      title: t("Discard unsaved changes?"),
      text: t("Opening model discovery closes this panel and discards your unsaved changes. Save first to keep them."),
      confirmLabel: t("Discard and discover"), danger: true,
    });
    if (!ok || state.drawer !== drawer) return;
  }
  openDiscoveryDrawer(drawer.id);
}

function abortDiscoveryScan(d) {
  d.scanSeq += 1;
  d.scanning = false;
  if (d.controller) d.controller.abort();
  d.controller = null;
}

async function runDiscovery({ keepSelection = false, retried = false } = {}) {
  const drawer = state.drawer;
  if (!isDiscoveryDrawer(drawer) || !state.snap) return;
  const d = drawer.discovery;
  if (d.scanning || d.saving) return;
  const controller = new AbortController();
  const seq = ++d.scanSeq;
  d.controller = controller;
  d.scanning = true;
  // The stale/expired banner stays while the rescan runs and after it fails, so a failure (429, offline) never unlocks the import.
  if (!d.locked) d.banner = null;
  d.error = "";
  render();
  try {
    // An omitted `harness` means every harness; any string, even "all", names exactly one.
    const scope = d.harness === ALL_HARNESSES ? {} : { harness: d.harness };
    const requested = { harness: d.harness, mode: d.mode };
    const data = await api("POST", "/api/discover", { ...scope, mode: d.mode, providers: "configured", revision: state.snap.revision }, controller.signal);
    if (state.drawer !== drawer || d.scanSeq !== seq) return;
    const reconciled = keepSelection ? reconcileSelection(d.selected, data.candidates) : { kept: new Set(), dropped: 0 };
    d.preview = data;
    d.scanned = requested;
    // The lock opens only when the scan that succeeded used the options the drawer shows now.
    if (requested.harness === d.harness && requested.mode === d.mode) {
      d.locked = null;
      d.banner = null;
    }
    d.selected = reconciled.kept;
    d.scanning = false;
    d.controller = null;
    if (reconciled.dropped > 0) toast("info", () => t("{0} selected models are no longer available.", reconciled.dropped));
    render();
  } catch (error) {
    if (state.drawer !== drawer || d.scanSeq !== seq) return;
    d.scanning = false;
    d.controller = null;
    if (error.status === 409 && error.data && error.data.snapshot && !retried) {
      // The files changed since the page loaded: adopt them and scan once more against the fresh revision.
      state.snap = error.data.snapshot;
      const limitsConflicts = rebaseLimitsDraft();
      if (limitsConflicts && limitsConflicts.length) toastLimitsConflicts(limitsConflicts);
      void runDiscovery({ keepSelection, retried: true });
      return;
    }
    d.error = t(error.message);
    render();
  }
}

async function commitDiscoveryImport() {
  const drawer = state.drawer;
  if (!isDiscoveryDrawer(drawer) || state.busy) return;
  const d = drawer.discovery;
  if (!d.preview || d.saving || d.scanning || d.selected.size === 0) return;
  const request = { preview_id: d.preview.preview_id, revision: d.preview.revision, selections: [...d.selected].map((key) => ({ key })) };
  d.saving = true;
  d.banner = null;
  d.error = "";
  state.busy = true;
  document.body.setAttribute("aria-busy", "true");
  render();
  let result = null;
  try {
    result = await api("POST", "/api/models/import", request);
    state.snap = result.snapshot;
    const limitsConflicts = rebaseLimitsDraft();
    if (limitsConflicts && limitsConflicts.length) toastLimitsConflicts(limitsConflicts);
  } catch (error) {
    const failure = discoveryImportFailure(error);
    if (failure.kind === "conflict" && error.data && error.data.snapshot) {
      state.snap = error.data.snapshot;
      const limitsConflicts = rebaseLimitsDraft();
      if (limitsConflicts && limitsConflicts.length) toastLimitsConflicts(limitsConflicts);
    }
    // A stale or expired preview keeps the import locked until a rescan succeeds, however the drawer is used meanwhile.
    if (failure.kind === "conflict" || failure.kind === "expired") d.locked = failure.kind;
    d.banner = failure.kind === "error" ? { kind: "error", text: t(failure.text) } : { kind: failure.kind };
  } finally {
    state.busy = false;
    document.body.removeAttribute("aria-busy");
    d.saving = false;
  }
  if (!result) { render(); return; }
  const imported = Array.isArray(result.imported) ? result.imported.length : 0;
  const enabled = Array.isArray(result.enabled) ? result.enabled.length : 0;
  toast("ok", () => t("Imported {0} {1}, enabled {2} {3}", imported, countLabel(imported, "model"), enabled, countLabel(enabled, "model")));
  const back = state.drawer === drawer ? detachDrawer() : null;
  normalizeFilters();
  syncUrl();
  render();
  if (back) restoreDrawerReturn(back);
}

function clearDiscoveryFilters(d) {
  d.query = "";
  d.status = "all";
  d.provider = ALL_PROVIDERS;
  render();
}

function toggleDiscoverySelection(d, key, checked, row) {
  if (checked && d.selected.size >= MAX_IMPORT_SELECTION) return;
  if (checked) d.selected.add(key); else d.selected.delete(key);
  if (row) row.classList.toggle("is-selected", checked);
  syncDiscoveryUi(d);
}

function toggleVisibleSelection(d) {
  const visible = visibleCandidates(d);
  if (selectionToggleMode(d.selected, visible) === "clear") {
    d.selected = new Set();
  } else {
    const next = selectActionable(d.selected, visible);
    d.selected = next.selected;
    if (next.capped) toast("info", () => t("Limit of {0} models per import reached", MAX_IMPORT_SELECTION));
  }
  refreshDiscoveryList(d);
}

/** Re-renders only the review list and its count (search typing never replaces the focused input). */
function refreshDiscoveryList(d) {
  const list = $("discover-list");
  if (!list || !d.preview) { render(); return; }
  list.replaceChildren(discoveryList(d));
  syncDiscoveryUi(d);
}

/** Footer summary, Import button, selection toggle, and the batch limit on unchecked rows. */
function syncDiscoveryUi(d) {
  const summary = d.preview ? selectionSummary(d.preview.candidates, d.selected) : { total: 0, fresh: 0, enable: 0 };
  const text = $("discover-summary");
  if (text) {
    text.textContent = summary.total
      ? t("{0} selected ({1} new, {2} to enable)", summary.total, summary.fresh, summary.enable)
      : t("Select models to import or enable");
    text.classList.toggle("has-selection", summary.total > 0);
  }
  const limit = $("discover-limit");
  if (limit) limit.hidden = d.selected.size < MAX_IMPORT_SELECTION;
  const blocked = Boolean(d.locked) || Boolean(d.banner && (d.banner.kind === "conflict" || d.banner.kind === "expired"));
  const importButton = $("discover-import");
  if (importButton) {
    importButton.disabled = d.saving || d.scanning || !d.preview || summary.total === 0 || Boolean(blocked);
    importButton.replaceChildren(h("span", { text: d.saving ? t("Importing…") : t("Import selected") }));
  }
  const toggleButton = $("d-select-toggle");
  if (toggleButton && d.preview) {
    const visible = visibleCandidates(d);
    toggleButton.disabled = d.saving || (!d.selected.size && !visible.some(isActionableCandidate));
    toggleButton.replaceChildren(h("span", { text: selectionToggleMode(d.selected, visible) === "clear" ? t("Clear selection") : t("Select all actionable") }));
  }
  for (const box of $("drawer").querySelectorAll(".ledger-check")) box.disabled = d.saving || (!box.checked && d.selected.size >= MAX_IMPORT_SELECTION);
}

function ledgerRow(d, candidate) {
  const actionable = isActionableCandidate(candidate);
  const selected = d.selected.has(candidate.key);
  const discovered = candidate.discovered;
  const route = discovered.cli_provider ? `${discovered.cli_provider} / ${discovered.cli_model}` : discovered.cli_model;
  const quality = candidate.metadata_quality;
  const contextTitle = typeof discovered.context_window === "number" ? t("Context: {0} tokens", discovered.context_window) : null;
  const classes = `ledger-row${actionable ? "" : " is-passive"}${selected ? " is-selected" : ""}`;
  const check = actionable
    ? h("input", {
      type: "checkbox", class: "ledger-check", checked: selected, disabled: d.saving || (!selected && d.selected.size >= MAX_IMPORT_SELECTION),
      "data-fk": `dc-${candidate.key}`,
      "aria-label": candidate.action === "enable" ? t("Enable {0}", candidate.proposed_id) : t("Import {0}", candidate.proposed_id),
      onchange: (event) => toggleDiscoverySelection(d, candidate.key, event.target.checked, event.target.closest(".ledger-row")),
    })
    : h("span", { "aria-hidden": "true" });
  const content = [
    check,
    h("div", { class: "ledger-main" },
      h("span", { class: "ledger-id", translate: "no", text: candidate.proposed_id }),
      h("span", { class: "ledger-route", translate: "no", text: route })),
    h("div", { class: "ledger-meta" },
      h("div", { class: "ledger-meta-line" },
        badge(candidate.harness, "mono", { translate: "no" }),
        h("span", { class: "ledger-context", title: contextTitle, text: discoveryContext(discovered) }),
        statusPill(DISCOVERY_STATUS_PILL[candidate.status] || "muted", t(DISCOVERY_STATUS_LABEL[candidate.status] || candidate.status),
          candidate.status === "ambiguous" ? { title: t("Several disabled cards match this model; enable the right one by hand.") } : {})),
      h("div", { class: "ledger-meta-line" },
        badge(t(DISCOVERY_QUALITY_LABEL[quality] || quality), "outline", { title: t(DISCOVERY_QUALITY_HINT[quality] || DISCOVERY_QUALITY_HINT.curated) }),
        h("span", { class: "ledger-evidence", text: t(DISCOVERY_EVIDENCE_LABEL[discovered.evidence] || discovered.evidence) }))),
  ];
  return h("li", { class: "ledger-item" }, actionable ? h("label", { class: classes }, content) : h("div", { class: classes }, content));
}

function discoveryList(d) {
  if (!d.preview.candidates.length) {
    return emptyState({ iconName: "models", title: t("No models found."),
      text: t("The scanned CLIs reported no models. Check the notes above, or add a model by hand.") });
  }
  const visible = visibleCandidates(d);
  if (!visible.length) {
    return emptyState({ iconName: "search", title: t("No matching models."), text: t("Try a different search, or clear the filters to see every model."),
      actions: [button(t("Clear filters"), { cls: "btn", iconName: "reset", onclick: () => clearDiscoveryFilters(d) })] });
  }
  const shown = visible.slice(0, DISCOVERY_RENDER_LIMIT);
  return h("div", {},
    h("ul", { class: "ledger" }, shown.map((candidate) => ledgerRow(d, candidate))),
    shown.length < visible.length
      ? h("p", { class: "field-hint", text: t("Showing the first {0} of {1}. Narrow the filters to see the rest.", shown.length, visible.length) })
      : null);
}

function discoveryNotes(preview) {
  const notes = discoveryDiagnosticNotes(preview).map((note) =>
    statusPill(note.kind, t("{0}: {1}", note.harness, t(note.label)), { title: note.title }));
  if (preview.truncated) {
    notes.push(statusPill("warn", t("Preview limited to the first {0} of {1} models.", preview.candidates.length, preview.total_candidates)));
  }
  return notes.length ? h("div", { class: "discover-notes", role: "group", "aria-label": t("Scan notes") }, notes) : null;
}

function discoveryFilterBar(d) {
  const candidates = d.preview.candidates;
  const providers = discoveryProviders(candidates);
  const counts = discoveryStatusCounts(candidates);
  const search = h("input", {
    class: "input", type: "text", id: "d-search", "data-fk": "d-search", enterkeyhint: "search", autocomplete: "off", spellcheck: "false",
    placeholder: t("Search by ID or model…"), "aria-label": t("Search discovered models"), maxlength: MAX_QUERY_LENGTH,
    oninput: (event) => { d.query = event.target.value; refreshDiscoveryList(d); },
  });
  search.value = d.query;
  return h("div", { class: "discover-filters", role: "group", "aria-label": t("Filters") },
    h("div", { class: "search-box", role: "search" }, icon("search"), search),

  const issues = [];
  const harness = entry(state.snap.harnesses, value.harness);
  const model = entry(state.snap.models, value.model);
  if (!harness) issues.push(["danger", t("Missing harness")]);

  if (!model) issues.push(["danger", t("Missing model")]);

async function savePreset() {
  const drawer = state.drawer;
  const d = drawer.draft;
  for (const [role, value] of Object.entries(d.roles)) {
    if (!value.model || !value.effort) { toast("error", () => t("Choose a model and effort for role “{0}”.", role)); return; }
  }
  let id = drawer.id;
  let patch;
  if (drawer.isNew) {
    id = validateNewId("presets");
    if (!id) return;
    if (!d.description.trim()) { toast("error", () => t("Enter a preset description.")); return; }
    patch = { description: d.description.trim(), enabled: d.enabled, roles: clone(d.roles), custom: true };
  } else {
    patch = {};
    if (d.description !== drawer.original.description) patch.description = d.description;
    if (d.enabled !== drawer.original.enabled) patch.enabled = d.enabled;
    const roles = {};
    for (const role of Object.keys(drawer.original.roles)) if (!Object.hasOwn(d.roles, role)) roles[role] = null;
    for (const [role, value] of Object.entries(d.roles)) if (!same(value, entry(drawer.original.roles, role))) roles[role] = clone(value);
    if (Object.keys(roles).length) patch.roles = roles;
    if (!Object.keys(patch).length) { toast("info", () => t("No changes")); return; }
  }
  if (await mutate("PUT", `/api/presets/${encodeURIComponent(id)}`, { patch }, () => drawer.isNew ? t("Preset added") : t("Preset saved"))) {
    if (state.drawer === drawer) {
      state.presetSelected = id;
      syncUrl();
      openDrawer("preset", id);
    }
  }
}

// ---------------------------------------------------------------------------
// Limits & security view
// ---------------------------------------------------------------------------
const LIMIT_SPECS = DEFAULT_GROUPS.flatMap((group) => group.fields);

function ensureLimitsDraft() {
  if (!state.limitsDraft || !state.limitsOriginal) {
    state.limitsOriginal = clone(state.snap.defaults);
    state.limitsDraft = clone(state.snap.defaults);
  }
  return state.limitsDraft;
}

function limitsChanges() {
  if (!state.limitsDraft || !state.snap) return {};
  return diff(state.snap.defaults, state.limitsDraft);
}

/** Per-field errors: integer range checks, timeouts that must not exceed max_timeout_sec, and the host cap at or above max_concurrency. */
function limitsErrors(draft) {
  const errors = {};
  for (const spec of LIMIT_SPECS) {
    if (spec.bool || spec.options) continue;
    const value = draft[spec.key];
    const outOfRange = !Number.isInteger(value) || value < spec.min || (spec.max !== undefined && value > spec.max);
    if (!outOfRange) continue;
    errors[spec.key] = spec.max !== undefined
      ? t("{0} must be between {1} and {2}.", t(spec.label), spec.min, spec.max)
      : t("{0} must be a whole number of at least {1}.", t(spec.label), spec.min);
  }
  const maxTimeout = draft.max_timeout_sec;
  if (Number.isInteger(maxTimeout) && !errors.max_timeout_sec) {
    if (Number.isInteger(draft.default_timeout_sec) && !errors.default_timeout_sec && draft.default_timeout_sec > maxTimeout) {
      errors.default_timeout_sec = t("The default timeout cannot exceed the maximum timeout.");
    }
    if (Number.isInteger(draft.high_effort_timeout_sec) && !errors.high_effort_timeout_sec && draft.high_effort_timeout_sec > maxTimeout) {
      errors.high_effort_timeout_sec = t("The high-effort timeout cannot exceed the maximum timeout.");
    }
    if (Number.isInteger(draft.idle_timeout_sec) && !errors.idle_timeout_sec && draft.idle_timeout_sec > 0 && draft.idle_timeout_sec > maxTimeout) {
      errors.idle_timeout_sec = t("The idle timeout cannot exceed the maximum timeout.");
    }
    if (Number.isInteger(draft.timeout_extension_sec) && !errors.timeout_extension_sec && draft.timeout_extension_sec > maxTimeout) {
      errors.timeout_extension_sec = t("The timeout extension step cannot exceed the maximum timeout.");
    }
  }
  if (Number.isInteger(draft.max_concurrency) && !errors.max_concurrency
    && Number.isInteger(draft.host_max_concurrency) && !errors.host_max_concurrency && draft.host_max_concurrency < draft.max_concurrency) {
    errors.host_max_concurrency = t("The host concurrency cap cannot be below the concurrent-task limit.");
  }
  return errors;
}

/**
 * The errors that may block saving `patch`: a field's own error, and the cross-field ordering errors only when the
 * save touches the limit they are compared against (DEPENDENT_LIMITS) or the field itself. A stale violation elsewhere is shown inline but never
 * blocks an unrelated save.
 */
function blockingLimitsErrors(draft, patch) {
  const errors = limitsErrors(draft);
  const related = new Set(Object.entries(DEPENDENT_LIMITS).flatMap(([anchor, keys]) => Object.hasOwn(patch, anchor) ? keys : []));
  return Object.fromEntries(Object.entries(errors).filter(([key]) => Object.hasOwn(patch, key) || related.has(key)));
}

function limitControl(spec, draft, error) {
  const fk = `d-${spec.key}`;
  if (spec.bool) {
    return toggle(Boolean(draft[spec.key]), (v) => { draft[spec.key] = v; render(); }, { fk, label: t(spec.label), text: draft[spec.key] ? t("On") : t("Off") });
  }
  if (spec.options) {
    return selectBox(spec.options.map(([value, label]) => [value, t(label)]), draft[spec.key], (v) => { draft[spec.key] = v; render(); }, { fk, label: t(spec.label) });
  }
  const input = textInput(draft[spec.key], (v) => {
    draft[spec.key] = v === "" ? "" : Number(v);
    syncLimitsUi();
  }, { fk, type: "number", mono: true, min: spec.min, max: spec.max });
  input.setAttribute("aria-invalid", String(Boolean(error)));
  input.setAttribute("aria-describedby", `${fk}-hint ${fk}-error`);
  return h("div", { class: "input-row" }, input,
    spec.unit || ZERO_HINTS[spec.key] ? h("span", { class: "setting-unit", "data-unit-for": spec.key, text: formatUnit(draft[spec.key], spec.unit, spec.key) }) : null);
}

function limitRow(spec, draft, errors) {
  const provenance = (state.snap.defaults_provenance || {})[spec.key];
  const unsaved = !same(draft[spec.key], state.snap.defaults[spec.key]);
  const overridden = provenance === "overridden";
  const fk = `d-${spec.key}`;
  const error = errors[spec.key];
  return h("div", { class: `setting-row${overridden || unsaved ? " is-modified" : ""}`, "data-setting": spec.key },
    h("div", {},
      h("div", { class: "field-head" },
        h("label", { class: "field-label", for: fk, text: t(spec.label) }),
        h("code", { class: "field-key", translate: "no", text: spec.key }),
        limitMark(spec.key, unsaved, overridden),
        overridden ? iconButton("reset", t("Reset {0} to default", t(spec.label)), { cls: "icon-btn reset-field", "data-fk": `reset-${spec.key}`,
          onclick: () => void resetLimitField(spec.key) }) : null),
      h("p", { class: "field-hint", id: `${fk}-hint`, text: t(spec.hint) }),
      spec.key === "locale" ? h("p", { class: "field-hint", text: t("This setting controls the orchestrator’s messages, not this page. Use the EN / RU switch in the sidebar for the page language.") }) : null),
    h("div", { class: "setting-control" },
      limitControl(spec, draft, error),
      h("span", { class: "field-error", id: `${fk}-error`, "data-error-for": spec.key, role: "alert", hidden: !error, text: error || "" }),
      limitDefaultHint(spec, draft)));
}

function limitMark(key, unsaved, overridden) {
  if (!unsaved && !overridden) return null;
  return h("span", { class: "mod-mark", "data-mark-for": key }, h("span", { class: "dot overridden", "aria-hidden": "true" }), t(unsaved ? "unsaved" : "modified"));
}

function limitDefaultHint(spec, draft) {
  const base = state.defs.defaults;
  if (same(draft[spec.key], base[spec.key])) return null;
  const defaultText = spec.options
    ? t((spec.options.find(([value]) => value === base[spec.key]) || [base[spec.key], String(base[spec.key])])[1])
    : `${formatValue(base[spec.key])}${spec.unit && typeof base[spec.key] === "number" ? ` (${formatUnit(base[spec.key], spec.unit, spec.key)})` : ""}`;
  return h("span", { class: "field-hint", "data-default-for": spec.key, text: t("Default {0}", defaultText) });
}

/** Always present: says whether the limits are saved, unsaved (with the count), saving, or blocked by invalid fields. */
function limitsSaveBar() {
  const patch = limitsChanges();
  const changes = Object.keys(patch).length;
  const problems = changes ? Object.values(blockingLimitsErrors(state.limitsDraft, patch)) : [];
  const kind = state.busy ? "saving" : changes ? "dirty" : "clean";
  const text = kind === "saving" ? t("Saving…") : kind === "dirty" ? t("Unsaved changes ({0})", changes) : t("All changes saved");
  return h("div", { class: `sticky-save-bar${changes ? " is-dirty" : ""}${problems.length ? " is-invalid" : ""}`, id: "limits-save-bar", role: "region", "aria-label": t("Save changes bar") },
    h("span", { class: `save-status is-${kind}`, role: "status", "aria-live": "polite" }, icon(kind === "clean" ? "check" : kind === "saving" ? "refresh" : "alert"), text),
    h("div", { class: "save-actions" },
      changes ? button(t("Discard"), { cls: "btn ghost", iconName: "reset", "data-fk": "limits-discard", disabled: state.busy, onclick: discardLimits }) : null,
      button(t("Save changes"), { cls: "btn primary", iconName: "check", id: "limits-save", "data-fk": "limits-save", title: t("Press {0} to save", SAVE_SHORTCUT),
        "aria-keyshortcuts": "Control+S Meta+S", disabled: !changes || state.busy, onclick: () => void saveLimits() }),
      h("span", { class: "save-hint", "aria-hidden": "true", text: SAVE_SHORTCUT })),
    problems.length ? h("div", { class: "save-errors", "aria-live": "polite" },
      h("span", { class: "field-error", text: t("Fix the highlighted fields before saving.") }),
      problems.map((problem) => h("span", { class: "field-hint", text: problem }))) : null);
}

function refreshLimitsSaveBar() {
  const current = $("limits-save-bar");
  if (!current || !state.limitsDraft || !state.snap) return;
  const next = limitsSaveBar();
  const focus = captureFocus();
  current.className = next.className;
  current.replaceChildren(...next.childNodes);
  restoreFocus(focus);
}

/** Updates rows and the save bar in place while typing so number inputs keep focus and partial input. */
function syncLimitsUi() {
  if (state.tab !== "limits" || !state.limitsDraft) return;
  const draft = state.limitsDraft;
  const errors = limitsErrors(draft);
  for (const spec of LIMIT_SPECS) {
    const row = document.querySelector(`[data-setting="${spec.key}"]`);
    if (!row) continue;
    const unsaved = !same(draft[spec.key], state.snap.defaults[spec.key]);
    const overridden = (state.snap.defaults_provenance || {})[spec.key] === "overridden";
    row.classList.toggle("is-modified", unsaved || overridden);
    // The "unsaved" / "modified" badge follows the stripe immediately.
    const mark = limitMark(spec.key, unsaved, overridden);
    const currentMark = row.querySelector(`[data-mark-for="${spec.key}"]`);
    if (mark && currentMark) currentMark.replaceWith(mark);
    else if (mark) row.querySelector(".field-key").after(mark);
    else if (currentMark) currentMark.remove();
    const hint = limitDefaultHint(spec, draft);
    const currentHint = row.querySelector(`[data-default-for="${spec.key}"]`);
    if (hint && currentHint) currentHint.replaceWith(hint);
    else if (hint) row.querySelector(".setting-control").append(hint);
    else if (currentHint) currentHint.remove();
    const unit = row.querySelector(`[data-unit-for="${spec.key}"]`);
    if (unit) unit.textContent = formatUnit(draft[spec.key], spec.unit, spec.key);
    const errorEl = row.querySelector(`[data-error-for="${spec.key}"]`);
    if (errorEl) { errorEl.textContent = errors[spec.key] || ""; errorEl.hidden = !errors[spec.key]; }
    const input = row.querySelector("input.input");
    if (input) input.setAttribute("aria-invalid", String(Boolean(errors[spec.key])));
  }
  refreshLimitsSaveBar();
}

function keepLimitsValues() {
  state.limitsConflicts = [];
  render();
  toast("info", () => t("Your values are kept. Save to overwrite the file with them."));
}

function reloadLimitsFromDisk() {
  for (const key of activeLimitsConflicts()) state.limitsDraft[key] = clone(state.snap.defaults[key]);
  state.limitsConflicts = [];
  render();
  toast("ok", () => t("Limits reloaded from disk"));
}

/** Lists the limits edited here and on disk; stays until the user keeps their values or reloads the disk ones. */
function limitsConflictBanner() {
  const keys = activeLimitsConflicts();
  if (!keys.length) return null;
  return banner("danger", t("These limits were also changed in another window or in the file and differ from your unsaved edits. Choose which values to keep."),
    h("ul", { class: "quarantine-list", "data-fk": "limits-conflicts" },
      keys.map((key) => h("li", { translate: "no", text: t("{0}: yours {1}, on disk {2}", key, formatValue(state.limitsDraft[key]), formatValue(state.snap.defaults[key])) }))),
    h("div", { class: "banner-actions" },
      button(t("Keep my values"), { cls: "btn sm", iconName: "check", "data-fk": "limits-keep", disabled: state.busy, onclick: keepLimitsValues }),
      button(t("Reload from disk"), { cls: "btn sm", iconName: "refresh", "data-fk": "limits-reload", disabled: state.busy, onclick: reloadLimitsFromDisk })));
}

function discardLimits() {
  clearLimitsDraft();
  render();
  $("main").focus({ preventScroll: true });
}

async function resetLimitField(key) {
  const base = state.defs.defaults;
  if (await mutate("PUT", "/api/defaults", { patch: { [key]: base[key] } }, () => t("Reset {0}", key))) {
    if (state.limitsDraft) state.limitsDraft[key] = clone(state.snap.defaults[key]);
    render();
  }
}

function renderLimits() {
  const draft = ensureLimitsDraft();
  const errors = limitsErrors(draft);
  const toc = h("nav", { class: "limits-toc", "aria-label": t("On this page") }, DEFAULT_GROUPS.map((group) =>
    h("a", { href: `#limits-${group.id}`, "aria-current": state.limitsSection === group.id ? "true" : null, "data-fk": `toc-${group.id}`,
      onclick: (event) => {
        event.preventDefault();
        state.limitsSection = group.id;
        for (const link of document.querySelectorAll(".limits-toc a")) link.toggleAttribute("aria-current", link === event.currentTarget);
        event.currentTarget.setAttribute("aria-current", "true");
        const target = $(`limits-${group.id}`);
        if (target) target.scrollIntoView({ block: "start", behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      } }, t(group.title))));
  const sections = DEFAULT_GROUPS.map((group) => h("section", { class: "limits-section", id: `limits-${group.id}`, "aria-labelledby": `limits-${group.id}-title` },
    h("div", {},
      h("h2", { class: "limits-section-title", id: `limits-${group.id}-title`, text: t(group.title) })),
    h("div", { class: "limits-fields" }, group.fields.map((spec) => limitRow(spec, draft, errors)))));
  return h("div", {},
    pageHead(t("Limits and security"), t("Global queue, timeout, output size, and security settings from [defaults].")),
    limitsConflictBanner(),
    h("div", { class: "limits-layout", id: "limits-form", inert: state.busy }, toc, h("div", { class: "limits-sections" }, sections)),
    limitsSaveBar(),
    h("div", { class: "section-foot", id: "limits-foot" },
      button(t("Reset limits to defaults"), { cls: "btn ghost sm", iconName: "reset", onclick: async () => {
        const ok = await confirmDialog({ title: t("Reset limits to defaults?"), text: t("This will restore the built-in values for all [defaults] settings."), confirmLabel: t("Reset limits"), danger: true });
        if (ok && await mutate("POST", "/api/reset-section", { section: "defaults" }, () => t("Limits reset to defaults"))) { clearLimitsDraft(); render(); }
      } }),
      button(t("Reset all to defaults"), { cls: "btn danger sm", iconName: "reset", onclick: () => void resetAll() })));
}

async function saveLimits() {
  const patch = limitsChanges();
  if (!Object.keys(patch).length) { toast("info", () => t("No changes")); return; }
  if (state.busy) return;
  // A concurrent disk edit of a limit the user also edited must be decided on explicitly, never overwritten by a plain Save.
  if (activeLimitsConflicts().length) {
    toast("error", () => t("Resolve the limit conflicts first: keep your values or reload them from disk."));
    focusByKey("limits-keep");
    return;
  }
  const errors = blockingLimitsErrors(state.limitsDraft, patch);
  const firstError = Object.keys(errors)[0];
  if (firstError) {
    toast("error", () => t("Fix the highlighted fields before saving."), () => Object.values(blockingLimitsErrors(state.limitsDraft, limitsChanges())));
    const invalid = document.querySelector(`[data-fk="d-${firstError}"]`);
    if (invalid) invalid.scrollIntoView({ block: "center" });
    focusByKey(`d-${firstError}`);
    return;
  }
  // The form is frozen while the request runs, so the draft still matches `patch`; any later edit would stay as an unsaved draft.
  if (await mutate("PUT", "/api/defaults", { patch }, () => t("Limits saved")) && !limitsDirty()) { clearLimitsDraft(); render(); }
  // The Save button is disabled again once nothing is pending, which would leave keyboard focus on the page body.
  if (document.activeElement === document.body && state.tab === "limits") focusByKey(`d-${LIMIT_SPECS[0].key}`);
}

function limitsDirty() {
  return Boolean(state.limitsDraft && state.snap && Object.keys(limitsChanges()).length > 0);
}

async function resetAll() {
  const ok = await confirmDialog({
    title: t("Reset all settings to defaults?"),
    text: t("This will remove all edits to models, harnesses, presets, and limits and restore the built-in catalog."),
    note: t("A backup will be saved before the reset at {0}.bak.<timestamp>", state.paths.user),
    confirmLabel: t("Reset all"), danger: true,
  });
  if (!ok) return;
  if (await mutate("POST", "/api/reset-all", {}, () => t("Defaults restored. A .bak backup was saved beside your configuration file."))) {
    clearLimitsDraft();
    state.drawer = null;
    state.drawerReturn = null;
    render();
  }
}

// ---------------------------------------------------------------------------
// Render loop, keyboard & boot
// ---------------------------------------------------------------------------
/** Entries the server set aside because they failed validation; the rest of the configuration stays in effect. */
function quarantineBanner() {
  const items = (state.snap && state.snap.quarantined) || [];
  if (!items.length) return null;
  return banner("", t("Some entries are invalid and set aside. All other valid settings stay active. Fix or reset these entries to bring them back."),
    h("ul", { class: "quarantine-list", "data-fk": "quarantine-list" },
      items.map(({ section, id, reason }) => h("li", {}, h("code", { translate: "no", text: `${section}.${id}` }), `: ${reason}`,
        h("button", { type: "button", class: "btn sm", "data-fk": `quarantine-reset-${section}.${id}`, disabled: state.busy,
          "aria-label": t("Reset invalid entry {0}", `${section}.${id}`), onclick: () => void resetQuarantined(section, id) }, t("Reset"))))));
}

/** Removes the user's override of a set-aside entry (a built-in one returns to its default, a custom one is deleted). The ID travels in the body. */
async function resetQuarantined(section, id) {
  const name = `${section}.${id}`;
  const ok = await confirmDialog({
    title: t("Reset the invalid entry “{0}”?", name),
    text: t("This removes your edits to {0} from the configuration file. A built-in entry returns to its default; a custom entry is deleted.", name),
    confirmLabel: t("Reset"), danger: true,
  });
  if (!ok) return;
  await mutate("POST", "/api/quarantined/reset", { section, id }, () => t("Invalid entry {0} was reset.", name));
}

/** Config warnings without the ones the quarantine banner already lists. */
function visibleConfigWarnings() {
  const items = state.snap.quarantined || [];
  return (state.snap.config_warnings || []).filter((warning) => !items.some(({ section, id }) => warning.startsWith(`Quarantined ${section}.${id} from `)));
}

function render(options = {}) {
  // A rebuilt page leaves no open list behind; the focused trigger is restored by key below. A drawer that is not rebuilt
  // (background health probes) keeps its open list.
  if (!(options.skipDrawer && activeSelect && activeSelect.owner.closest("#drawer"))) closeActiveSelect();
  const focus = captureFocus();
  const focusWasInDrawer = Boolean(state.drawer) && $("drawer").contains(document.activeElement);
  renderChrome();
  const main = $("main");
  if (!state.snap) {
    main.replaceChildren(state.loadError
      ? banner("danger", t(state.loadError))
      : h("div", { class: "loading-screen", role: "status", text: t("Loading configuration…") }));
    renderDrawer();
    syncOverlays();
    return;
  }
  const banners = [];
  if (state.offline) banners.push(banner("danger", t("Connection to the settings server lost. Restart agrmcp settings and open the new URL from your terminal.")));
  const quarantine = quarantineBanner();
  if (quarantine) banners.push(quarantine);
  for (const warning of visibleConfigWarnings()) banners.push(banner("", warning));
  const view = state.tab === "models" ? renderModels() : state.tab === "harnesses" ? renderHarnesses() : state.tab === "presets" ? renderPresets() : renderLimits();
  main.replaceChildren(...banners, view);
  if (!options.skipDrawer) renderDrawer();
  else refreshDrawerHealth();
  syncOverlays();
  restoreFocus(focus);
  if (focusWasInDrawer) keepDrawerFocus(focus);
}

/**
 * A control that disables itself (Scan while scanning, Save while saving) cannot keep focus; without a fallback focus would fall to
 * the inert page behind the drawer. It parks on the drawer panel and returns to the control once that is enabled again.
 */
function keepDrawerFocus(saved) {
  const drawerEl = $("drawer");
  const drawer = state.drawer;
  if (!drawer) return;
  const key = saved ? saved.key : drawer.refocusKey;
  if (document.activeElement !== drawerEl && drawerEl.contains(document.activeElement)) { drawer.refocusKey = null; return; }
  if (key && focusByKey(key)) { drawer.refocusKey = null; return; }
  if (saved) drawer.refocusKey = saved.key;
  drawerEl.focus({ preventScroll: true });
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("theme-color-meta").setAttribute("content", THEME_COLORS[theme] || THEME_COLORS.light);
  try { localStorage.setItem(THEME_KEY, theme); } catch { /* storage disabled */ }
  renderRailFooter();
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch { /* storage disabled */ }
  const preferred = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  const theme = saved === "light" || saved === "dark" ? saved : preferred;
  document.documentElement.dataset.theme = theme;
  $("theme-color-meta").setAttribute("content", THEME_COLORS[theme]);
}

function focusSearch() {
  if (state.tab !== "models") navigate("models");
  const input = $("model-search");
  if (input) { input.focus(); input.select(); }
}

const FOCUSABLE = "a[href], button, input, textarea, [tabindex]:not([tabindex='-1'])";

/** Keeps Tab / Shift+Tab inside the open drawer (the rest of the page is inert while it is open). */
function trapDrawerTab(event) {
  const drawerEl = $("drawer");
  if (!drawerEl.contains(document.activeElement)) return;
  const stops = [...drawerEl.querySelectorAll(FOCUSABLE)].filter((el) => !el.disabled && !el.closest("[inert]") && !el.closest("[hidden]"));
  if (!stops.length) { event.preventDefault(); return; }
  const first = stops[0];
  const last = stops[stops.length - 1];
  // Focus parked on the panel itself (see keepDrawerFocus) enters the cycle from the matching end.
  if (document.activeElement === drawerEl) { event.preventDefault(); (event.shiftKey ? last : first).focus(); }
  else if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}

function onKeydown(event) {
  if ($("confirm").open) return;
  const target = event.target;
  const mod = event.metaKey || event.ctrlKey;
  if (event.key === "Tab" && state.drawer) { trapDrawerTab(event); return; }
  if (mod && !event.altKey && !event.shiftKey && event.key.toLowerCase() === "s") {
    if (state.drawer) { event.preventDefault(); $("drawer-save")?.click(); return; }
    if (state.tab === "limits" && limitsDirty()) { event.preventDefault(); void saveLimits(); return; }
  }
  if (event.key === "Escape") {
    if (state.drawer) { event.preventDefault(); void closeDrawer(false); return; }
    if (mobileRailOpen()) { event.preventDefault(); setRailOpen(false); return; }
    if (target && target.dataset && target.dataset.fk === "model-search") {
      event.preventDefault();
      if (state.query) setModelFilter("query", ""); else target.blur();
    }
    return;
  }
  if (state.drawer || !state.snap) return;
  const searchShortcut = (event.key === SEARCH_SHORTCUT && !mod && !event.altKey) || (mod && !event.altKey && !event.shiftKey && event.key.toLowerCase() === "k");
  if (searchShortcut && !isTypingTarget(target)) {
    event.preventDefault();
    focusSearch();
    return;
  }
  if (event.altKey && !mod && !event.shiftKey && /^Digit[1-4]$/.test(event.code)) {
    event.preventDefault();
    navigate(TAB_IDS[Number(event.code.slice(5)) - 1], { focusMain: true });
  }
}

async function copyConfigPath() {
  if (!state.paths.user) return;
  try {
    await navigator.clipboard.writeText(state.paths.user);
    state.pathCopied = true;
    renderRailFooter();
    toast("ok", () => t("Configuration path copied"));
    setTimeout(() => { state.pathCopied = false; renderRailFooter(); }, COPY_FEEDBACK_MS);
  } catch {
    toast("info", () => state.paths.user);
  }
}

function bindChrome() {
  for (const langButton of $("lang-toggle").querySelectorAll("button")) {
    langButton.addEventListener("click", () => {
      if (language === langButton.dataset.lang) return;
      language = langButton.dataset.lang;
      try { localStorage.setItem(LANG_KEY, language); } catch { /* storage disabled */ }
      render();
      for (const node of $("toasts").children) toastRenderers.get(node)?.();
    });
  }
  $("theme-toggle").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
  $("reset-all").addEventListener("click", () => void resetAll());
  $("rail-toggle").addEventListener("click", () => setRailOpen(!mobileRailOpen()));
  $("scrim").addEventListener("click", () => {
    if (state.drawer) void closeDrawer(false);
    else if (mobileRailOpen()) setRailOpen(false);
  });
  $("path-pill").addEventListener("click", () => void copyConfigPath());
  const skip = document.querySelector(".skip-link");
  if (skip) skip.addEventListener("click", (event) => { event.preventDefault(); $("main").focus(); });
  if (window.matchMedia) {
    window.matchMedia(MOBILE_QUERY).addEventListener("change", () => { state.railOpen = false; syncOverlays(); });
  }
  document.addEventListener("keydown", onKeydown);
  window.addEventListener("beforeunload", (event) => {
    if (drawerHasUnsavedWork() || limitsDirty()) event.preventDefault();
  });
  scheduleHeartbeat();
}

async function boot() {
  try { language = localStorage.getItem(LANG_KEY) === "ru" ? "ru" : "en"; } catch { /* storage disabled */ }
  initTheme();
  readUrl();
  bindChrome();
  render();
  try {
    await loadState();
    normalizeFilters();
    syncUrl();
    render();
  } catch (error) {
    state.loadError = error.message || "Could not load the configuration.";
    render();
    return;
  }
  // Quiet background probe so the rail readiness indicator fills in without blocking the first paint.
  if (!state.health && !state.healthLoading) void loadHealth(false, { quiet: state.tab !== "harnesses" });
}

void boot();
</script>
</body>
</html>
