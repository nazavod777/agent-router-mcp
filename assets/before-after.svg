<svg xmlns="http://www.w3.org/2000/svg" width="800" height="476" viewBox="0 0 800 476" role="img" aria-label="Before: one CLI silently uses one model, reviews its own code, and edits the shared tree. After: agent-router-mcp validates strengths, cost, sandbox and vendor checks in orch_plan_preview, auto-fixes warnings, and launches immediately in isolated worktrees with cross-vendor review."><defs><linearGradient id="hair" x1="0" x2="1"><stop offset="0" stop-color="#F5F5F5" stop-opacity=".5"/><stop offset=".6" stop-color="#F5F5F5" stop-opacity=".08"/><stop offset="1" stop-color="#F5F5F5" stop-opacity="0"/></linearGradient></defs><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;font-size:14px;white-space:pre}</style><rect x="1" y="1" width="798" height="200" fill="#0A0A0A" stroke="#262626" stroke-width="2"/><rect x="2" y="2" width="796" height="30" fill="#111111"/><path d="M2 32h796" stroke="url(#hair)" stroke-width="1.5"/><rect x="18" y="12" width="8" height="8" fill="#F5F5F5"/><rect x="32" y="12" width="8" height="8" fill="#F5F5F5" opacity=".4"/><rect x="46" y="12" width="8" height="8" fill="#F5F5F5" opacity=".18"/><text x="780" y="21" text-anchor="end" fill="#8A8A8A" style="font-size:12px">without agent-router-mcp</text><text x="24" y="64"><tspan fill="#FF5C6C">✗ Silent model spend</tspan><tspan fill="#8A8A8A">    — one flagship model burns quota on boilerplate &amp; scans</tspan></text><text x="24" y="92"><tspan fill="#FF5C6C">✗ Same-vendor self-review</tspan><tspan fill="#8A8A8A"> — author reviews its own diff with shared blind spots</tspan></text><text x="24" y="120"><tspan fill="#FF5C6C">✗ Shared tree collisions</tspan><tspan fill="#8A8A8A">  — parallel edits overwrite each other in the working dir</tspan></text><text x="24" y="148"><tspan fill="#FF5C6C">✗ Hidden sandbox gaps</tspan><tspan fill="#8A8A8A">     — no visibility into OS sandbox vs unsandboxed CLIs</tspan></text><text x="24" y="176"><tspan fill="#FF5C6C">✗ Extra API keys / ADEs</tspan><tspan fill="#8A8A8A">   — separate IDE or duplicate keys instead of local CLIs</tspan></text><rect x="1" y="217" width="798" height="258" fill="#0A0A0A" stroke="#262626" stroke-width="2"/><rect x="2" y="218" width="796" height="30" fill="#111111"/><path d="M2 248h796" stroke="url(#hair)" stroke-width="1.5"/><rect x="18" y="228" width="8" height="8" fill="#F5F5F5"/><rect x="32" y="228" width="8" height="8" fill="#F5F5F5" opacity=".4"/><rect x="46" y="228" width="8" height="8" fill="#F5F5F5" opacity=".18"/><text x="780" y="237" text-anchor="end" fill="#8A8A8A" style="font-size:12px">with agent-router-mcp</text><text x="24" y="280"><tspan fill="#A5B4FC">1. Plan</tspan><tspan fill="#8A8A8A">      orch_plan_preview → 17 CLIs · 43 models · sandbox &amp; vendor checks</tspan></text><text x="24" y="308"><tspan fill="#A5B4FC">2. Guard</tspan><tspan fill="#8A8A8A">     auto-fixes </tspan><tspan fill="#E5C07B">⚠ self-review, missing CLIs &amp; unsandboxed warnings</tspan></text><text x="24" y="336"><tspan fill="#FFDD00">3. Launch</tspan><tspan fill="#EDEDED">    orch_run ×N</tspan><tspan fill="#8A8A8A"> straight from plan_id — zero approval prompts, zero drift</tspan></text><text x="24" y="364"><tspan fill="#6FCB6E">4. Isolate</tspan><tspan fill="#8A8A8A">   readonly scans + parallel </tspan><tspan fill="#EDEDED">git worktree</tspan><tspan fill="#8A8A8A"> writes + ORCH_DEPTH guard</tspan></text><text x="24" y="392"><tspan fill="#6FCB6E">5. Verify</tspan><tspan fill="#8A8A8A">    orch_status all_terminal · cross-vendor review · diff before merge</tspan></text><path d="M24 414h752" stroke="#262626" stroke-width="1.5"/><text x="24" y="440"><tspan fill="#6FCB6E">✓</tspan><tspan fill="#EDEDED"> Uses your existing CLI logins</tspan><tspan fill="#8A8A8A"> (17 harnesses) · configure in </tspan><tspan fill="#A5B4FC">agrmcp settings</tspan></text></svg>
